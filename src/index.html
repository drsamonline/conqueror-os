const DAILY_PROMPTS = [
  "What did your body tell you today that your mind argued with?",
  "Where did you choose the faster reaction over the slower, better one?",
  "What setback this week is actually a lesson about a method, not about you?",
  "What did you deliberately set down today, and what did you pick up?",
  "Which habit ran on autopilot today — and was that good or bad?",
  "What would a calmer version of you have done in the moment you got activated?",
  "What are you carrying into tomorrow that you could leave here tonight?"
];
function dailyPrompt(){
  const d = new Date();
  const n = Math.floor(d.getTime()/86400000) % DAILY_PROMPTS.length;
  return DAILY_PROMPTS[n];
}
function onThisDay(){
  const mmdd = todayKey().slice(5);
  return (state.journal||[]).filter(j=>j.date && j.date.slice(5)===mmdd && j.date!==todayKey());
}

/* ---------- spaced repetition (SM-2 lite) ---------- */
function reviewItems(){
  const items=[];
  CHAPTERS_ORDERED.forEach(c=>{
    items.push({key:c.id+"|quote", chapterId:c.id, kind:"quote", q:"Recall the key idea of “"+c.title+"”", a:c.quote});
    items.push({key:c.id+"|reflect", chapterId:c.id, kind:"reflect", q:"Reflection — "+c.title, a:c.reflection});
  });
  return items;
}
function dueReviews(){
  const today = todayKey();
  return reviewItems().filter(it=>{ const r=state.review[it.key]; return !r || !r.due || r.due<=today; });
}
function gradeReview(key, quality){ // quality 0..5
  const r = state.review[key] || {ease:2.5, interval:0, reps:0};
  if(quality<3){ r.reps=0; r.interval=0; }
  else {
    r.ease = Math.max(1.3, r.ease + (0.1 - (5-quality)*(0.08+(5-quality)*0.02)));
    r.interval = r.reps===0 ? 1 : r.reps===1 ? 6 : Math.round(r.interval*r.ease);
    r.reps++;
  }
  const due = new Date(); due.setDate(due.getDate() + Math.max(r.interval, quality<3?0:1));
  r.due = todayKey(due);
  state.review[key]=r; persist();
}

function buildGlossary(){
  const map = {};
  CHAPTERS_ORDERED.forEach(c=>(c.tags||[]).forEach(t=>{ (map[t]=map[t]||[]).push(c); }));
  return Object.keys(map).sort().map(term=>({term, chapters:map[term]}));
}

  [textEl, tagsEl].forEach(el=>el.addEventListener("input", saveDraft));
  typeSelect.addEventListener("change", saveDraft);

  document.getElementById("j-save").addEventListener("click", ()=>{
    const text=textEl.value.trim();
    if(!text){ showToast("Write something first."); return; }
    const tags = tagsEl.value.split(",").map(s=>s.trim()).filter(Boolean);
    const type=typeSelect.value, t=getJournalType(type);
    const entry={id:uid(), date:document.getElementById("j-date").value||todayKey(), text, mood:selectedMood, type, tags,
      chapterId: t.needsChapter?document.getElementById("j-chapter").value:null, attachments: pendingAttachments.slice(), createdAt:Date.now()};
    state.journal.push(entry); state.drafts.journal=null; pendingAttachments=[];
    persist(); showToast("Entry saved."); announce("Journal entry saved."); renderJournal();
  });

  // dictation
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  document.getElementById("j-dictate").addEventListener("click", ()=>{
    if(!SR){ showToast("Speech recognition isn't supported in this browser."); return; }
    const rec=new SR(); rec.continuous=true; rec.interimResults=true;
    let base=textEl.value;
    rec.onresult=e=>{ let s=""; for(let i=e.resultIndex;i<e.results.length;i++) s+=e.results[i][0].transcript; textEl.value=base+(base?" ":"")+s; saveDraft(); };
    rec.onerror=()=>showToast("Dictation error.");
    rec.start(); showToast("Listening… click Dictate again to stop.");
    document.getElementById("j-dictate").addEventListener("click", ()=>rec.stop(), {once:true});
  });

  // attachments (IndexedDB)
  let pendingAttachments=[];
  document.getElementById("j-attach").addEventListener("change", async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{ const id=await idbPut(f); pendingAttachments.push({id, name:f.name, type:f.type}); renderAttachList(); }
    catch(_){ showToast("Couldn't store attachment in this browser."); }
  });
  function renderAttachList(){ document.getElementById("j-attach-list").textContent = pendingAttachments.length?("Attached: "+pendingAttachments.map(a=>a.name).join(", ")):""; }

  document.getElementById("journal-filter-tabs").addEventListener("click", e=>{
    const b=e.target.closest("button[data-f]"); if(!b) return;
    journalFilter=b.dataset.f;
    document.querySelectorAll("#journal-filter-tabs button").forEach(x=>x.classList.toggle("active",x===b));
    refreshJournalList();
  });
  document.getElementById("jf-from").addEventListener("change", e=>{ journalFrom=e.target.value; refreshJournalList(); });
  document.getElementById("jf-to").addEventListener("change", e=>{ journalTo=e.target.value; refreshJournalList(); });
  document.getElementById("jf-tag").addEventListener("change", e=>{ journalTagFilter=e.target.value; refreshJournalList(); });
  let tt=null; document.getElementById("jf-text").addEventListener("input", e=>{ journalText=e.target.value; clearTimeout(tt); tt=setTimeout(refreshJournalList,150); });
  document.getElementById("jf-clear").addEventListener("click", ()=>{ journalFrom=journalTo=journalTagFilter=journalText=""; renderJournal(); });

  function refreshJournalList(){
    const list=state.journal.slice().reverse().filter(j=>{
      if(journalFilter!=="all" && (j.type||"daily")!==journalFilter) return false;
      if(journalTagFilter && !((j.tags||[]).includes(journalTagFilter))) return false;
      if(journalFrom && j.date<journalFrom) return false;
      if(journalTo && j.date>journalTo) return false;
      if(journalText && !((j.text||"").toLowerCase().includes(journalText.toLowerCase()))) return false;
      return true;
    });
    document.getElementById("journal-list").innerHTML = list.length?list.map(entryCard).join(""):'<div class="empty-state"><div class="glyph">✎</div>Nothing written yet for this filter.</div>';
    const c=document.getElementById("journal-count"); if(c) c.textContent=list.length;
  }

  document.getElementById("journal-list").addEventListener("click", async e=>{
    const del=e.target.closest("[data-del-journal]"), ed=e.target.closest("[data-edit-journal]");
    if(del){ const id=del.dataset.delJournal; const idx=state.journal.findIndex(j=>j.id===id); if(idx<0) return;
      if(await xConfirm("Delete this journal entry?",{danger:true,confirmLabel:"Delete"})){
        const [removed]=state.journal.splice(idx,1); persist(); renderJournal();
        toastAction("Entry deleted.","Undo",()=>{ state.journal.splice(idx,0,removed); persist(); render(); });
      } }
    if(ed){ editJournal(ed.dataset.editJournal); }
  });
};

let _idb=null;
function idbOpen(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open("conquerorOS.files",1); r.onupgradeneeded=()=>{ r.result.createObjectStore("files"); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
async function idbPut(file){ if(!_idb) _idb=await idbOpen(); return new Promise((res,rej)=>{ const tx=_idb.transaction("files","readwrite"); const id=uid(); tx.objectStore("files").put(file,id); tx.oncomplete=()=>res(id); tx.onerror=()=>rej(tx.error); }); }
async function idbGet(id){ if(!_idb) _idb=await idbOpen(); return new Promise((res,rej)=>{ const tx=_idb.transaction("files","readonly"); const rq=tx.objectStore("files").get(id); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }

activeTracker = "mood";
renderTrackers = function(){
  const main=document.getElementById("main");
  const defs=allTrackerDefs();
  const tracker=defs.find(t=>t.id===activeTracker)||defs[0];
  const entries=state.trackers.filter(t=>t.trackerType===activeTracker).slice().reverse();
  const isNum = tracker.isNumber;

  main.innerHTML = viewShell("Trackers","Independent daily trackers. Small numbers, tracked honestly, beat vague impressions.",
    '<div class="tab-row" id="tracker-tabs">'+defs.map(t=>'<button data-t="'+t.id+'" class="'+(t.id===activeTracker?"active":"")+'">'+escapeHtml(t.label)+'</button>').join("")+
      '<button data-new class="add-tracker">+ New</button></div>'+
    '<div class="block" style="border-color:var(--accent);"><h4 id="t-log-title">Log '+escapeHtml(tracker.label)+'</h4>'+
      '<div class="form-row"><label for="t-date">Date</label><input type="date" id="t-date" value="'+todayKey()+'"></div>'+
      '<div class="form-row"><label>Value'+(tracker.unit?(" ("+escapeHtml(tracker.unit)+")"):"")+'</label>'+
        (isNum?'<input type="text" id="t-value" placeholder="e.g. '+(tracker.id==="sleep"?"7.5":"20")+'">'
              :'<div class="scale-picker" id="t-scale" role="radiogroup" aria-label="Value">'+Array.from({length:tracker.scale},(_,i)=>i+1).map(n=>'<button type="button" role="radio" data-val="'+n+'" aria-checked="false">'+n+'</button>').join("")+'</div>')+
      '</div>'+
      '<div class="form-row"><label for="t-notes">Notes (optional)</label><input type="text" id="t-notes" placeholder="Context worth remembering"></div>'+
      '<button class="btn" id="t-save">Save entry</button></div>'+
    '<div class="section-title">Last 14 days</div>'+renderTrackerChart(activeTracker)+
    '<div class="section-title">Correlation</div>'+
    '<div class="filter-row"><select id="corr-a" aria-label="Tracker A">'+defs.map(d=>'<option value="'+d.id+'" '+(d.id===activeTracker?"selected":"")+'>'+escapeHtml(d.label)+'</option>').join("")+'</select>'+
      '<select id="corr-b" aria-label="Tracker B">'+defs.map(d=>'<option value="'+d.id+'">'+escapeHtml(d.label)+'</option>').join("")+'</select>'+
      '<button class="btn secondary" id="corr-go">Compute</button></div><div id="corr-out" class="hint"></div>'+
    '<div class="section-title">Calendar heatmap</div>'+heatmap(activeTracker)+
    '<div class="section-title">Entries ('+entries.length+')</div><div id="tracker-list">'+
      (entries.length?entries.map(t=>'<div class="entry-card"><div class="entry-head"><span>'+fmtDate(t.date)+'</span><span>value '+t.value+'</span></div>'+
        (t.notes?'<p>'+escapeHtml(t.notes)+'</p>':"")+'<div class="entry-actions"><button data-edit-tracker="'+t.id+'">Edit</button><button data-del-tracker="'+t.id+'">Delete</button></div></div>').join("")
        :'<div class="empty-state"><div class="glyph">▲</div>No entries yet for '+escapeHtml(tracker.label)+'.</div>')+'</div>'
  );

  document.getElementById("tracker-tabs").addEventListener("click", e=>{
    if(e.target.closest("[data-new]")){ newTrackerDef(); return; }
    const b=e.target.closest("button[data-t]"); if(b){ activeTracker=b.dataset.t; renderTrackers(); }
  });

  let scaleVal=null;
  const scaleWrap=document.getElementById("t-scale");
  if(scaleWrap) scaleWrap.addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; scaleVal=Number(b.dataset.val);
    scaleWrap.querySelectorAll("button").forEach(x=>{ x.classList.remove("selected"); x.setAttribute("aria-checked","false"); }); b.classList.add("selected"); b.setAttribute("aria-checked","true"); });

  document.getElementById("t-save").addEventListener("click", ()=>{
    const date=document.getElementById("t-date").value||todayKey();
    let value;
    if(isNum){ value=parseFloat(document.getElementById("t-value").value); if(isNaN(value)){ showToast("Enter a valid number."); return; }
      const lo=tracker.min!=null?tracker.min:0, hi=tracker.max!=null?tracker.max:(tracker.id==="sleep"?24:100000);
      if(value<lo||value>hi){ showToast("Value should be between "+lo+" and "+hi+"."); return; } }
    else { value=scaleVal; if(value==null){ showToast("Pick a value on the scale."); return; } }
    state.trackers.push({id:uid(), trackerType:activeTracker, date, value, notes:document.getElementById("t-notes").value.trim(), createdAt:Date.now()});
    persist(); showToast("Logged."); announce("Tracker entry saved."); renderTrackers();
  });

  document.getElementById("corr-go").addEventListener("click", ()=>{
    const a=document.getElementById("corr-a").value, b=document.getElementById("corr-b").value;
    const out=document.getElementById("corr-out");
    const days=last14Days();
    const pairs=days.map(k=>{ const ea=state.trackers.filter(t=>t.trackerType===a&&t.date===k).slice(-1)[0]; const eb=state.trackers.filter(t=>t.trackerType===b&&t.date===k).slice(-1)[0]; return (ea&&eb)?[ea.value,eb.value]:null; }).filter(Boolean);
    if(pairs.length<3){ out.textContent="Not enough overlapping days yet (need 3+)."; return; }
    const xs=pairs.map(p=>p[0]), ys=pairs.map(p=>p[1]);
    const mx=xs.reduce((s,v)=>s+v,0)/xs.length, my=ys.reduce((s,v)=>s+v,0)/ys.length;
    let num=0,dx=0,dy=0; pairs.forEach(p=>{ num+=(p[0]-mx)*(p[1]-my); dx+=(p[0]-mx)**2; dy+=(p[1]-my)**2; });
    const r = (dx&&dy)?num/Math.sqrt(dx*dy):0;
    out.textContent = "Pearson r = "+r.toFixed(2)+" over "+pairs.length+" overlapping days ("+(Math.abs(r)>0.5?"strong":Math.abs(r)>0.3?"moderate":"weak")+" "+(r>=0?"positive":"negative")+"). Correlation is not causation.";
  });

  document.getElementById("tracker-list").addEventListener("click", async e=>{
    const del=e.target.closest("[data-del-tracker]"), ed=e.target.closest("[data-edit-tracker]");
    if(del){ const id=del.dataset.delTracker; const idx=state.trackers.findIndex(t=>t.id===id); if(idx<0) return;
      const [removed]=state.trackers.splice(idx,1); persist(); renderTrackers();
      toastAction("Entry deleted.","Undo",()=>{ state.trackers.splice(idx,0,removed); persist(); render(); }); }
    if(ed){ editTracker(ed.dataset.editTracker); }
  });
};

renderTrackerChart = function(type){
  const days=last14Days(); const def=trackerDef(type); const max=def.max||def.scale||5;
  const vals=days.map(k=>{ const es=state.trackers.filter(t=>t.trackerType===type&&t.date===k); if(!es.length) return null; return es.reduce((s,e)=>s+e.value,0)/es.length; });
  const bars=days.map((k,i)=>{ const v=vals[i]; const h=v==null?2:Math.max(4,Math.min(100,(v/max)*100)); const hi=v!=null&&v/max>0.6?"hi":""; return '<div class="bar '+hi+'" style="height:'+h+'%" title="'+fmtDate(k)+': '+(v==null?"—":v.toFixed(1))+'"></div>'; }).join("");
  const labels=days.map((k,i)=>i%3===0?'<span>'+fmtDate(k)+'</span>':'<span></span>').join("");
  // trendline + 7-day moving average overlay
  const nums=vals.map(v=>v==null?null:v);
  const ma=nums.map((_,i)=>{ const w=nums.slice(Math.max(0,i-6),i+1).filter(v=>v!=null); return w.length?w.reduce((s,v)=>s+v,0)/w.length:null; });
  const W=560,H=90;
  const line=(arr,color)=>{ const pts=arr.map((v,i)=>v==null?null:[i/(arr.length-1)*W, H-(v/max)*H]).filter(Boolean); return pts.length<2?"":'<polyline fill="none" stroke="'+color+'" stroke-width="2" points="'+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'"/>'; };
  return '<div class="bar-chart">'+bars+'</div><div class="bar-chart-labels">'+labels+'</div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" class="spark" role="img" aria-label="Trend of '+escapeHtml(def.label)+'">'+line(nums,"var(--accent)")+line(ma,"var(--steel)")+'</svg>'+
    '<div class="hint"><span class="legend-dot" style="background:var(--accent)"></span> daily · <span class="legend-dot" style="background:var(--steel)"></span> 7-day average</div>';
};

function heatmap(type){
  const weeks=18; const cells=[];
  const start=new Date(); start.setDate(start.getDate()-weeks*7+1);
  for(let i=0;i<weeks*7;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const k=todayKey(d);
    const es=state.trackers.filter(t=>t.trackerType===type&&t.date===k); const v=es.length?es[0].value:null;
    const lvl=v==null?0:(v>4?3:v>2?2:1); cells.push('<span class="hm hm-'+lvl+'" title="'+k+(v!=null?": "+v:"")+'"></span>'); }
  return '<div class="heatmap" role="img" aria-label="Calendar heatmap of '+escapeHtml(type)+'">'+cells.join("")+'</div>';
}

    if(pa){ const st=state.challenges[pa.dataset.pause]; st.paused=!st.paused; if(st.paused){ st.pausedAt=todayKey(); } else if(st.pausedAt){ st.pausedDays=(st.pausedDays||0)+daysElapsed(st.pausedAt); st.pausedAt=null; } persist(); renderChallenges(); }
    if(ab){ const id=ab.dataset.abandon; if(await xConfirm("Abandon this challenge? Its check-in history will be cleared.",{danger:true,confirmLabel:"Abandon"})){
        const saved=state.challenges[id]; delete state.challenges[id]; persist(); renderChallenges();
        toastAction("Challenge abandoned.","Undo",()=>{ state.challenges[id]=saved; persist(); render(); }); } }

/* ---------- search index extension ---------- */
buildSearchIndex = function(){
  if(_searchIndex) return _searchIndex;
  const docs=[];
  CONTENT.chapters.forEach(ch=>{
    docs.push({type:"Chapters", id:ch.id, title:ch.title, text:[ch.subtitle].concat(ch.body).join(" "), route:"#/reader/"+ch.id});
    docs.push({type:"Quotes", id:ch.id+"-q", title:ch.quote, text:ch.quote, route:"#/reader/"+ch.id});
    docs.push({type:"Exercises", id:ch.id+"-e", title:"Exercise — "+ch.title, text:ch.exercise, route:"#/reader/"+ch.id});
    docs.push({type:"Reflections", id:ch.id+"-r", title:"Reflection — "+ch.title, text:ch.reflection, route:"#/reader/"+ch.id});
  });
  Object.keys(state.notes||{}).forEach(id=>{ const c=getChapter(id); if(c&&state.notes[id]) docs.push({type:"Notes", id:"note-"+id, title:"Note — "+c.title, text:state.notes[id], route:"#/reader/"+id}); });
  Object.keys(state.highlights||{}).forEach(id=>{ const c=getChapter(id); (state.highlights[id]||[]).forEach(h=>docs.push({type:"Highlights", id:"hl-"+h.id, title:"Highlight — "+((c&&c.title)||id), text:h.text+" "+(h.note||""), route:"#/reader/"+id})); });
  state.journal.forEach(j=>docs.push({type:"Journal", id:j.id, title:"Journal — "+fmtDate(j.date), text:(j.text||"")+" "+((j.tags||[]).join(" ")), route:"#/journal"}));
  CONTENT.worksheets.forEach(w=>docs.push({type:"Worksheets", id:w.id, title:w.title, text:w.description+" "+w.fields.map(f=>f.label).join(" "), route:"#/worksheets/"+w.id}));
  CONTENT.challenges.forEach(c=>docs.push({type:"Challenges", id:c.id, title:c.title, text:c.description+" "+c.dailyAction, route:"#/challenges"}));
  buildGlossary().forEach(t=>docs.push({type:"Glossary", id:"g-"+t.term, title:t.term, text:t.chapters.map(c=>c.title).join(" "), route:"#/glossary"}));
  _searchIndex=docs; return docs;
};

/* ---------- global keys + search ---------- */
initSearch = function(){
  const overlay=document.getElementById("search-overlay");
  const input=document.getElementById("search-input");
  const results=document.getElementById("search-results");
  const openers=[document.getElementById("search-box")];
  function open(){ overlay.classList.add("open"); input.value=""; results.innerHTML=""; setTimeout(()=>input.focus(),20); }
  function close(){ overlay.classList.remove("open"); }
  openers.forEach(el=>{ el.addEventListener("click", open); el.addEventListener("keydown", e=>{ if(e.key==="Enter") open(); }); });
  overlay.addEventListener("click", e=>{ if(e.target===overlay) close(); });
  input.addEventListener("input", ()=>{
    const q=input.value;
    if(!q.trim()){ results.innerHTML=""; return; }
    const grouped=runSearch(q);
    if(!Object.keys(grouped).length){ results.innerHTML='<div class="search-empty">No results for "'+escapeHtml(q)+'"</div>'; return; }
    const n=Object.values(grouped).reduce((s,a)=>s+a.length,0);
    announce(n+" results");
    results.innerHTML=Object.keys(grouped).map(type=>'<div class="search-group"><h4>'+type+'</h4>'+
      grouped[type].map(d=>'<a class="search-result" href="'+d.route+'" data-close-search="1">'+escapeHtml(d.title)+'<span class="snippet">'+escapeHtml(snippet(d.text,q))+'</span></a>').join("")+'</div>').join("");
  });
  results.addEventListener("click", e=>{ if(e.target.closest("[data-close-search]")) close(); });
  window.__openSearch=open; window.__closeSearch=close;
};

function initGlobalKeys(){
  let gPending=false, gTimer=null;
  document.addEventListener("keydown", e=>{
    const tag=document.activeElement && document.activeElement.tagName;
    const typing = tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT";
    if((e.ctrlKey||e.metaKey) && (e.key==="k"||e.key==="K")){ e.preventDefault(); openPalette(); return; }
    if(typing) return;
    if(e.key==="/"){ e.preventDefault(); if(window.__openSearch) window.__openSearch(); return; }
    if(e.key==="?"){ e.preventDefault(); openShortcuts(); return; }
    if(e.key==="Escape"){ if(window.__closeSearch) window.__closeSearch(); document.body.classList.remove("focus-mode"); return; }
    // g-prefixed navigation
    if(gPending){
      gPending=false; clearTimeout(gTimer);
      const map={d:"dashboard",l:"library",j:"journal",t:"trackers",c:"challenges",i:"insights",b:"bookmarks",r:"review",g:"glossary",s:"settings"};
      if(map[e.key.toLowerCase()]){ navigate(map[e.key.toLowerCase()]); }
      return;
    }
    if(e.key==="g"){ gPending=true; gTimer=setTimeout(()=>gPending=false,900); return; }
    // reader shortcuts
    const {view, params}=parseHash();
    if(view==="reader" && params && params[0]){
      const idx=chapterIndex(params[0]);
      if(e.key==="ArrowRight" && CHAPTERS_ORDERED[idx+1]) navigate("reader/"+CHAPTERS_ORDERED[idx+1].id);
      if(e.key==="ArrowLeft" && CHAPTERS_ORDERED[idx-1]) navigate("reader/"+CHAPTERS_ORDERED[idx-1].id);
      if(e.key==="b"){ const btn=document.getElementById("btn-bookmark"); if(btn) btn.click(); }
      if(e.key==="f"){ const btn=document.getElementById("btn-fav"); if(btn) btn.click(); }
      if(e.key==="r"){ const btn=document.getElementById("btn-tts"); if(btn) btn.click(); }
      if(e.key==="h"){ const btn=document.getElementById("btn-hl-amber"); if(btn) btn.click(); }
    }
  });
}

        "When you are already activated, the useful question is not how to feel calm but how to interrupt the escalation before it compounds. This chapter is a single, rehearsed move for that moment.",
        "Physiologically, a strong emotion has a chemical arc measured in roughly a minute to a minute and a half. If nothing new feeds it, the wave recedes on its own. The trap is that most of us feed it — by rehearsing the argument, replaying the slight, or narrating the unfairness — and reset the clock each time.",
        "The move is to buy ninety seconds without feeding the wave. Lengthen the exhale, name what is happening in plain words ('this is anger', 'this is fear'), and change your physical position. None of these requires the situation to be resolved; they only require you to stop adding fuel for ninety seconds.",
        "Run it enough times and it stops feeling like a technique and starts feeling like a reflex. The point is not to suppress the emotion — it is to keep the emotion from making the next decision for you."

    { id:"ch-field-script", order:2, title:"The Two-Sentence Script", subtitle:"Saying the hard thing without the heat",
      tags:["communication","conflict","boundaries"], emotion:"anxious", difficulty:"intermediate", estimatedReadingMinutes:7,
      body:[
        "Hard conversations fail less often on the substance than on the delivery. Under pressure, people reach for either an accusation or a retreat, and both cost you the outcome you actually wanted.",
        "A two-sentence script removes the improvisation. Sentence one names the specific, observable thing. Sentence two names the specific ask. No history, no character assessment, no 'you always'.",
        "For example: 'The last two drafts came in after the deadline. I need them by Thursday at noon so I can review them before the client call.' That is the whole script. It is hard to argue with because it contains nothing to argue with — only a fact and a request.",

const APP_VERSION = "3.0";

/* ---------- boot (replaces the original) ---------- */
function boot(){
  try{
    applyTheme();
    initSearch();
    initScrollTracking();
    initGlobalKeys();
    if(state.settings.lock && !window.__unlocked){ showLockScreen(); return; }
    render();
    if(!Storage.available) showStorageWarning();
    maybeOnboard();
  }catch(err){
    console.error(err);
    showBootError(err);
  }
}
function showLockScreen(){
  const m=xModal('<h3>Conqueror OS is locked</h3><p>Enter your PIN to open your workspace.</p>'+
    '<input type="password" data-pin data-autofocus><div class="x-actions"><button class="btn" data-ok>Unlock</button></div>',{title:"Locked", onEscape:()=>{ setTimeout(showLockScreen,50); }});
  function attempt(){ const pin=m.el.querySelector("[data-pin]").value; checkLock(pin).then(ok=>{ if(ok){ window.__unlocked=true; m.close(); boot(); } else { showToast("Incorrect PIN."); m.el.querySelector("[data-pin]").value=""; } }); }
  m.el.querySelector("[data-ok]").addEventListener("click", attempt);
  m.el.querySelector("[data-pin]").addEventListener("keydown", e=>{ if(e.key==="Enter") attempt(); });
}


boot();


})();
