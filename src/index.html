<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Conqueror OS — a private, offline resilience workspace: read, reflect, journal, track and review, all in one file.">
<meta name="theme-color" content="#C7742A">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23C7742A'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='Georgia,serif'%3EC%3C/text%3E%3C/svg%3E">
<title>Conqueror OS</title>
<script>
window.addEventListener("error", function(e){
  try{
    var main = document.getElementById("main");
    if(main && main.innerHTML.trim().length > 50) return; /* app is running; ignore */
    var d = document.getElementById("boot-error");
    if(!d){ d = document.createElement("div"); d.id = "boot-error"; d.className = "boot-error"; (document.body||document.documentElement).appendChild(d); }
    d.innerHTML = '<h1>Conqueror OS couldn\'t start</h1><p>An error occurred while starting the app in this browser:</p><pre></pre><p>Open this file directly in a recent Chrome, Safari, Firefox or Edge, with JavaScript enabled. Your saved data is not affected.</p>';
    d.querySelector("pre").textContent = (e.message || "Unknown error") + (e.lineno ? ("  (line " + e.lineno + ")") : "");
  }catch(_){}
});
</script>
<style>
/* =========================================================
   DESIGN TOKENS
   ========================================================= */
:root{
  --ink-900:#17181A;
  --ink-700:#2B2E33;
  --ink-500:#5A5F66;
  --paper-0:#F7F5F1;
  --paper-100:#EFECE5;
  --line:#D8D3C6;
  --signal:#C7742A;
  --signal-dim:#E3B893;
  --steel:#3E5C76;
  --good:#4B7A51;
  --bad:#A8433A;

  --bg:var(--paper-0);
  --bg-raised:#FFFFFF;
  --bg-sunken:var(--paper-100);
  --text:var(--ink-900);
  --text-dim:var(--ink-500);
  --border:var(--line);
  --accent:var(--signal);
  --accent-soft:var(--signal-dim);

  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;

  --radius:3px;
  --dur:160ms;
}
[data-theme="dark"]{
  --bg:var(--ink-900);
  --bg-raised:#1F2124;
  --bg-sunken:#101113;
  --text:#EDEAE3;
  --text-dim:#9AA0A8;
  --border:#34373C;
  --accent:var(--signal);
  --accent-soft:#5A3B25;
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:0.001ms!important;transition-duration:0.001ms!important;}
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--steel);}
button{font-family:inherit;}
.skip-link{
  position:absolute;left:-9999px;top:0;background:var(--accent);color:#fff;
  padding:.6em 1em;z-index:1000;
}
.skip-link:focus{left:0;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:56px 1fr 40px;height:100vh;grid-template-areas:
  "sidebar header"
  "sidebar main"
  "sidebar footer";
}
@media (max-width:820px){
  #app{grid-template-columns:0 1fr;}
  #sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;transform:translateX(-100%);transition:transform var(--dur);z-index:200;}
  #sidebar.open{transform:translateX(0);}
  #app.sidebar-open::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:150;}
}

#header{grid-area:header;display:flex;align-items:center;gap:1rem;padding:0 1rem;border-bottom:1px solid var(--border);background:var(--bg-raised);}
#sidebar{grid-area:sidebar;background:var(--bg-sunken);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;}
#main{grid-area:main;overflow-y:auto;position:relative;}
#footer{grid-area:footer;display:flex;align-items:center;justify-content:space-between;padding:0 1rem;border-top:1px solid var(--border);background:var(--bg-raised);font-size:.8rem;color:var(--text-dim);}

.brand{font-family:var(--font-display);font-weight:700;font-size:1.05rem;letter-spacing:.02em;padding:1rem;border-bottom:1px solid var(--border);}
.brand small{display:block;font-family:var(--font-body);font-weight:400;color:var(--text-dim);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}

nav.primary{display:flex;flex-direction:column;padding:.5rem;}
nav.primary a{
  display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;border-radius:var(--radius);
  color:var(--text);text-decoration:none;font-size:.9rem;
}
nav.primary a:hover{background:var(--bg-raised);}
nav.primary a[aria-current="page"]{background:var(--accent-soft);color:var(--ink-900);font-weight:600;}
[data-theme="dark"] nav.primary a[aria-current="page"]{color:#fff;}
.nav-icon{width:1.1em;text-align:center;font-family:var(--font-mono);opacity:.8;}

.recent-box{margin-top:auto;padding:.8rem;border-top:1px solid var(--border);font-size:.75rem;color:var(--text-dim);}
.recent-box h3{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;margin:.2rem 0 .5rem;}
.recent-box a{display:block;color:var(--text-dim);text-decoration:none;padding:.15rem 0;}
.recent-box a:hover{color:var(--accent);}

#menu-toggle{display:none;background:none;border:1px solid var(--border);border-radius:var(--radius);padding:.3rem .6rem;cursor:pointer;}
@media (max-width:820px){#menu-toggle{display:block;}}

#search-box{flex:1;display:flex;align-items:center;background:var(--bg-sunken);border:1px solid var(--border);border-radius:var(--radius);padding:.35rem .6rem;max-width:420px;}
#search-input{border:0;background:none;outline:none;color:var(--text);width:100%;font-size:.9rem;}
#search-box kbd{font-family:var(--font-mono);font-size:.65rem;color:var(--text-dim);border:1px solid var(--border);border-radius:2px;padding:0 4px;}

#breadcrumb{font-size:.8rem;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
#breadcrumb a{color:var(--text-dim);text-decoration:none;}
#breadcrumb a:hover{color:var(--accent);}

.header-spacer{flex:1;}
.icon-btn{background:none;border:1px solid var(--border);border-radius:var(--radius);width:2.1rem;height:2.1rem;cursor:pointer;color:var(--text);font-size:.95rem;}
.icon-btn:hover{background:var(--bg-sunken);}

/* ---------- Search overlay ---------- */
#search-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;padding-top:8vh;z-index:300;}
#search-overlay.open{display:flex;}
#search-panel{background:var(--bg-raised);width:min(560px,92vw);border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.3);max-height:70vh;display:flex;flex-direction:column;overflow:hidden;}
#search-panel input{border:0;border-bottom:1px solid var(--border);padding:.9rem 1rem;font-size:1.05rem;outline:none;background:none;color:var(--text);}
#search-results{overflow-y:auto;}
.search-group h4{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);padding:.6rem 1rem .2rem;margin:0;}
.search-result{display:block;padding:.5rem 1rem;text-decoration:none;color:var(--text);cursor:pointer;border-left:2px solid transparent;}
.search-result:hover,.search-result.active{background:var(--bg-sunken);border-left-color:var(--accent);}
.search-result .snippet{display:block;font-size:.78rem;color:var(--text-dim);margin-top:.1rem;}
.search-empty{padding:1rem;color:var(--text-dim);font-size:.85rem;}

/* ---------- Content views ---------- */
.view{padding:1.5rem 2rem 3rem;max-width:920px;margin:0 auto;}
.view h1{font-family:var(--font-display);font-size:1.9rem;margin:0 0 .2rem;}
.view h1 + p.lede{color:var(--text-dim);margin-top:0;}

.widget-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem;margin-top:1.3rem;}
.widget{background:var(--bg-raised);border:1px solid var(--border);border-radius:6px;padding:1rem 1.1rem;}
.widget h3{margin:0 0 .5rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);}
.widget .big{font-family:var(--font-display);font-size:1.6rem;}
.widget p{margin:.2rem 0 0;font-size:.85rem;color:var(--text-dim);}
.widget a.cta{display:inline-block;margin-top:.6rem;font-size:.82rem;color:var(--accent);text-decoration:none;font-weight:600;}

/* Conqueror ribbon - signature element: a linear campaign-map streak ruler */
.ribbon{background:var(--bg-raised);border:1px solid var(--border);border-radius:6px;padding:1rem 1.2rem;margin-top:1.3rem;}
.ribbon-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.6rem;}
.ribbon-head .streak-num{font-family:var(--font-display);font-size:1.4rem;color:var(--accent);}
.ribbon-track{position:relative;height:34px;display:flex;gap:3px;}
.ribbon-tick{flex:1;border-radius:2px;background:var(--bg-sunken);position:relative;}
.ribbon-tick.done{background:var(--accent);}
.ribbon-tick.today{outline:2px solid var(--accent);outline-offset:1px;}
.ribbon-labels{display:flex;justify-content:space-between;font-size:.68rem;color:var(--text-dim);margin-top:.3rem;}

.section-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin:2rem 0 .6rem;}

/* Library */
.book-card{display:flex;gap:1rem;background:var(--bg-raised);border:1px solid var(--border);border-radius:6px;padding:1rem;margin-bottom:.8rem;text-decoration:none;color:var(--text);align-items:center;}
.book-card:hover{border-color:var(--accent);}
.book-cover{width:46px;height:60px;background:linear-gradient(160deg,var(--accent),var(--ink-700));border-radius:3px;flex-shrink:0;}
.book-meta h3{margin:0 0 .2rem;font-family:var(--font-display);font-size:1.1rem;}
.book-meta p{margin:0;font-size:.82rem;color:var(--text-dim);}
.chapter-list{list-style:none;padding:0;margin:.6rem 0 0;}
.chapter-list li a{display:flex;justify-content:space-between;gap:1rem;padding:.55rem .2rem;text-decoration:none;color:var(--text);border-bottom:1px solid var(--border);font-size:.92rem;}
.chapter-list li a:hover{color:var(--accent);}
.chapter-list .ch-time{color:var(--text-dim);font-size:.78rem;font-family:var(--font-mono);}
.progress-pip{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--border);margin-right:.5rem;}
.progress-pip.complete{background:var(--good);}
.progress-pip.inprogress{background:var(--accent);}

/* Reader */
.reader-wrap{display:grid;grid-template-columns:1fr 260px;gap:2rem;max-width:1080px;margin:0 auto;padding:1.5rem 2rem 2rem;transition:max-width var(--dur);}
@media (max-width:900px){.reader-wrap{grid-template-columns:1fr;}#reader-aside{order:2;}}
.reader-wrap.width-narrow{max-width:760px;}
.reader-wrap.width-medium{max-width:1080px;}
.reader-wrap.width-wide{max-width:1320px;}
body.focus-mode .reader-wrap{grid-template-columns:1fr;max-width:720px;}
body.focus-mode #reader-aside,body.focus-mode .reader-toolbar,body.focus-mode #reader-meta{display:none;}
body.focus-mode #header, body.focus-mode #sidebar, body.focus-mode #footer{display:none;}
body.focus-mode #app{grid-template-columns:0 1fr;grid-template-rows:1fr;grid-template-areas:"main";}
body.focus-mode #focus-exit{display:inline-flex;}
#focus-exit{display:none;position:fixed;top:1rem;right:1rem;z-index:250;align-items:center;gap:.4rem;}
#reader-meta{display:flex;gap:1rem;color:var(--text-dim);font-size:.8rem;margin-bottom:.4rem;flex-wrap:wrap;}
#reader-progress-bar{height:4px;background:var(--bg-sunken);border-radius:2px;overflow:hidden;margin:.6rem 0 1.4rem;}
#reader-progress-fill{height:100%;background:var(--accent);width:0%;}
.reader-body{font-family:var(--font-body);font-size:1.06rem;line-height:1.75;}
.reader-body.spacing-compact{line-height:1.45;}
.reader-body.spacing-comfortable{line-height:1.75;}
.reader-body.spacing-spacious{line-height:2.15;}
.reader-body p{margin:0 0 1.1em;}
.reader-body blockquote{border-left:3px solid var(--accent);margin:1.4em 0;padding:.3em 0 .3em 1em;font-family:var(--font-display);font-style:italic;color:var(--text-dim);}
.block{background:var(--bg-sunken);border:1px solid var(--border);border-radius:6px;padding:1.1rem 1.2rem;margin:1.6rem 0;}
.block h4{margin:0 0 .5rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);}
.block textarea{width:100%;min-height:80px;background:var(--bg-raised);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:.6rem;font-family:inherit;font-size:.92rem;resize:vertical;}
.reader-toolbar{display:flex;gap:.5rem;margin:.6rem 0 1.4rem;flex-wrap:wrap;}
.reader-toolbar button{background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius);padding:.35rem .7rem;font-size:.8rem;cursor:pointer;color:var(--text);}
.reader-toolbar button.active{background:var(--accent-soft);border-color:var(--accent);}
.hl-mark{padding:0 2px;border-radius:2px;}
.hl-amber{background:#F0D8B4;}
[data-theme="dark"] .hl-amber{background:#5a4526;}

#reader-aside .aside-block{background:var(--bg-raised);border:1px solid var(--border);border-radius:6px;padding:.9rem 1rem;margin-bottom:1rem;}
#reader-aside h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);margin:0 0 .5rem;}
#reader-aside ul{margin:0;padding-left:1.1rem;font-size:.85rem;}
#reader-aside li{margin-bottom:.3rem;}

.reader-nav{display:flex;justify-content:space-between;margin-top:2rem;gap:1rem;}
.reader-nav a{flex:1;border:1px solid var(--border);border-radius:6px;padding:.8rem 1rem;text-decoration:none;color:var(--text);font-size:.85rem;}
.reader-nav a:hover{border-color:var(--accent);}
.reader-nav .dir{display:block;color:var(--text-dim);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;}
.reader-nav .next{text-align:right;}

/* Journal / Trackers forms */
.form-row{margin-bottom:1rem;}
.form-row label{display:block;font-size:.8rem;color:var(--text-dim);margin-bottom:.3rem;font-weight:600;}
.form-row input[type=text],.form-row input[type=date],.form-row textarea,.form-row select{
  width:100%;padding:.55rem .6rem;background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:inherit;font-size:.92rem;
}
.form-row textarea{min-height:90px;resize:vertical;}
.btn{background:var(--accent);color:#fff;border:0;border-radius:var(--radius);padding:.55rem 1.1rem;font-size:.88rem;cursor:pointer;font-weight:600;}
.btn:hover{opacity:.9;}
.btn.secondary{background:none;border:1px solid var(--border);color:var(--text);}
.btn.danger{background:var(--bad);}

.scale-picker{display:flex;gap:.4rem;}
.scale-picker button{flex:1;padding:.5rem 0;border:1px solid var(--border);background:var(--bg-raised);border-radius:var(--radius);cursor:pointer;color:var(--text);}
.scale-picker button.selected{background:var(--accent);color:#fff;border-color:var(--accent);}

.entry-card{background:var(--bg-raised);border:1px solid var(--border);border-radius:6px;padding:.9rem 1rem;margin-bottom:.7rem;}
.entry-card .entry-head{display:flex;justify-content:space-between;font-size:.75rem;color:var(--text-dim);margin-bottom:.4rem;}
.entry-card p{margin:0;font-size:.92rem;}
.entry-card .entry-actions{margin-top:.5rem;display:flex;gap:.5rem;}
.entry-card .entry-actions button{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:.78rem;text-decoration:underline;padding:0;}

.tab-row{display:flex;gap:.4rem;border-bottom:1px solid var(--border);margin-bottom:1.2rem;flex-wrap:wrap;}
.tab-row button{background:none;border:none;padding:.6rem .9rem;font-size:.85rem;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;}
.tab-row button.active{color:var(--text);border-color:var(--accent);font-weight:600;}

.stat-row{display:flex;gap:1rem;flex-wrap:wrap;margin:1rem 0;}
.stat-pill{background:var(--bg-raised);border:1px solid var(--border);border-radius:6px;padding:.7rem 1rem;}
.stat-pill .n{font-family:var(--font-display);font-size:1.3rem;}
.stat-pill .l{font-size:.7rem;text-transform:uppercase;color:var(--text-dim);letter-spacing:.06em;}

.bar-chart{display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:.6rem;}
.bar-chart .bar{flex:1;background:var(--accent-soft);border-radius:2px 2px 0 0;position:relative;min-height:2px;}
.bar-chart .bar.hi{background:var(--accent);}
.bar-chart-labels{display:flex;gap:6px;margin-top:.3rem;}
.bar-chart-labels span{flex:1;text-align:center;font-size:.65rem;color:var(--text-dim);}

.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text-dim);}
.empty-state .glyph{font-size:2rem;margin-bottom:.5rem;}

.settings-group{margin-bottom:1.8rem;}
.settings-group h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--border);}
.switch{position:relative;width:42px;height:22px;background:var(--bg-sunken);border:1px solid var(--border);border-radius:20px;cursor:pointer;}
.switch.on{background:var(--accent);}
.switch .knob{position:absolute;top:1px;left:1px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform var(--dur);}
.switch.on .knob{transform:translateX(20px);}

.boot-error{max-width:660px;margin:11vh auto;padding:1.4rem 1.6rem;background:var(--bg-raised);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:6px;color:var(--text);line-height:1.55;box-shadow:0 6px 24px rgba(0,0,0,.08);}
.boot-error h1{font-size:1.2rem;margin:0 0 .6rem;font-family:var(--font-display);}
.boot-error p{margin:.5rem 0;font-size:.92rem;}
.boot-error pre{white-space:pre-wrap;word-break:break-word;background:var(--bg-sunken);padding:.6rem .7rem;border-radius:4px;font-size:.8rem;font-family:var(--font-mono);overflow:auto;margin:.6rem 0;}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:.6rem 1.1rem;border-radius:6px;font-size:.85rem;z-index:400;opacity:0;pointer-events:none;transition:opacity var(--dur);}
.toast.show{opacity:1;}
[data-theme="dark"] .toast{background:#EDEAE3;color:var(--ink-900);}

#toc-panel{position:fixed;top:0;right:0;bottom:0;width:300px;background:var(--bg-raised);border-left:1px solid var(--border);z-index:260;transform:translateX(100%);transition:transform var(--dur);overflow-y:auto;padding:1rem;}
#toc-panel.open{transform:translateX(0);}
#toc-panel h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);margin:0 0 .8rem;display:flex;justify-content:space-between;align-items:center;}
#toc-panel ol{list-style:none;padding:0;margin:0;counter-reset:toc;}
#toc-panel li{counter-increment:toc;}
#toc-panel a{display:block;padding:.55rem .3rem;text-decoration:none;color:var(--text);font-size:.88rem;border-bottom:1px solid var(--border);}
#toc-panel a::before{content:counter(toc) ". ";color:var(--text-dim);}
#toc-panel a[aria-current="true"]{color:var(--accent);font-weight:600;}
#toc-panel-close{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:1rem;}
#toc-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:255;display:none;}
#toc-overlay.open{display:block;}

.graph-wrap{background:var(--bg-raised);border:1px solid var(--border);border-radius:6px;padding:1rem;margin-top:1rem;}
.graph-legend{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:.78rem;color:var(--text-dim);margin-bottom:.6rem;}
.graph-legend span{display:inline-flex;align-items:center;gap:.4rem;}
.graph-legend i{width:10px;height:10px;border-radius:50%;display:inline-block;}
.graph-node circle{cursor:pointer;transition:opacity var(--dur);}
.graph-node text{font-size:11px;fill:var(--text);pointer-events:none;transition:opacity var(--dur);}
.graph-edge{transition:opacity var(--dur),stroke var(--dur);}
.graph-node:hover circle{stroke:var(--accent);stroke-width:2;}
#graph-info{margin-top:1rem;font-size:.85rem;color:var(--text-dim);min-height:1.4em;}

@media print{
  #sidebar,#header,#footer,.reader-toolbar,#reader-aside,.reader-nav,#search-overlay,#toc-panel,#toc-overlay,#focus-exit{display:none!important;}
  #app{display:block;}
  #main{overflow:visible;}
  body{background:#fff;color:#000;}
  :root,[data-theme="dark"]{--text:#000;--text-dim:#333;--border:#999;--accent:#000;--bg:#fff;--bg-raised:#fff;--bg-sunken:#fff;--good:#000;--bad:#000;--steel:#000;}
  .tab-row,#worksheet-history,.entry-actions,#report-period-tabs button,#report-print,#report-export,#ws-save{display:none!important;}
  .block{border:1px solid #999;}
}

/* ============================================================
   CONQUEROR OS — ENHANCEMENT STYLES
   ============================================================ */

/* extra themes */

[data-theme="dark"] .pill.on,[data-theme="oled"] .pill.on,[data-theme="contrast"] .pill.on{ color:#fff; }

.legend-dot{ display:inline-block; width:10px; height:10px; border-radius:50%; vertical-align:middle; margin-right:.2rem; }

.gloss-item h3{ margin:0 0 .15rem; font-size:.95rem; font-family:var(--font-display); }

  .reader-toolbar,.x-overlay,.toast-action,.sel-pop,.filter-row,.export-grid{ display:none !important; }

<script>
(function(){
"use strict";

/* =========================================================
   1. STORAGE ENGINE
   ========================================================= */
const STORAGE_KEY = "conquerorOS.v1";
const SCHEMA_VERSION = 1;

const Storage = {
  available:true,
  load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      const parsed = JSON.parse(raw);
      if(!parsed || typeof parsed !== "object") return null;
      return parsed;
    }catch(e){
      Storage.available = false;
      console.error("Storage load failed", e);
      return null;
    }
  },
  save(state){
    try{
      const payload = Object.assign({}, state, {schemaVersion: SCHEMA_VERSION, savedAt: new Date().toISOString()});
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      return true;
    }catch(e){
      Storage.available = false;
      console.error("Storage save failed", e);
      showToast("Could not save — storage may be full.");
      return false;
    }
  },
  exportBackup(state){
    const payload = Object.assign({}, state, {schemaVersion: SCHEMA_VERSION, exportedAt: new Date().toISOString()});
    return JSON.stringify(payload, null, 2);
  },
  restoreBackup(json){
    try{
      const parsed = JSON.parse(json);
      if(!parsed || typeof parsed !== "object" || !("settings" in parsed)) {
        throw new Error("Not a recognizable Conqueror OS backup.");
      }
      return parsed;
    }catch(e){
      throw new Error("Invalid backup file: " + e.message);
    }
  }
};

/* =========================================================
   2. CONTENT — canonical content objects
   The Resilience Protocol (Book 1)
   ========================================================= */
const CONTENT = {
  books: [
    {
      id:"book-resilience", type:"book", title:"The Resilience Protocol",
      subtitle:"A working system for staying functional under pressure",
      description:"Six chapters on how stress actually works in the body and mind, and the concrete practices that convert pressure into capability instead of damage.",
      tags:["resilience","stress","discipline"], estimatedReadingMinutes:52
    }
  ],
  parts: [
    {id:"part-foundations", type:"part", bookId:"book-resilience", title:"Part I — Foundations", order:1}
  ],
  chapters: [
    {
      id:"ch-stress-response", type:"chapter", bookId:"book-resilience", partId:"part-foundations", order:1,
      title:"The Stress Response",
      subtitle:"Why pressure feels like danger",
      tags:["stress","physiology","fight-or-flight"], emotion:"tense", difficulty:"foundational",
      estimatedReadingMinutes:9,
      body:[
        "The problem is simple to name and hard to live with: your body cannot tell the difference between a deadline and a physical threat. A late invoice, a difficult conversation, an exam — the same alarm system fires as if a predator had just stepped into the room. Heart rate climbs, breathing shortens, attention narrows. None of this is a malfunction. It is the oldest survival software you own, running exactly as designed.",
        "This happens because the response evolved for a world of immediate physical danger, not sustained modern pressure. A rush of cortisol and adrenaline was built to get you through minutes, not months. It sharpens short-term focus and strength at the direct cost of digestion, long-term planning, and immune function. When the trigger is a single sprint from a threat, that trade is a bargain. When the trigger is an inbox that refills every morning, the same trade quietly bankrupts you.",
        "In real life this shows up as people who describe themselves as 'wired but tired' — unable to relax, unable to sleep, unable to fully finish the thought that started the tension in the first place. The body stays in a low simmer of alert readiness long after the meeting ended or the email was sent. Over months, this shows up as tight shoulders, shallow breathing become a habit, and a baseline irritability that has nothing to do with any single event.",
        "The useful reframe is that stress is not the enemy — an unregulated stress response is. Elite performers in high-pressure fields are not people who feel less activation; they are people who have practiced returning to baseline faster. The skill being trained is not calmness at rest, it is recovery speed after activation. That is a trainable variable, not a fixed trait.",
        "The most direct lever is the breath, because it is the one part of the stress response you can operate manually. A slower exhale than inhale (for example, four counts in, six counts out) directly signals the vagus nerve to shift the body out of alert mode. This is not a metaphor or a mood trick — it is a mechanical override available to you in real time, in a meeting, at a desk, before you speak."
      ],
      reflection:"Think of the last time your body reacted to a non-physical threat as if it were physical. Where did you feel it first — chest, jaw, stomach, hands? Write one sentence describing the earliest physical signal you get before you consciously notice you're stressed.",
      exercise:"Practice the 4-6 breath (4 counts in through the nose, 6 counts out through the mouth) for two minutes, three times today: once before something you're dreading, once during it if possible, and once after. Log how activated you felt (1-10) before and after each round.",
      quote:"The goal is not a life without pressure. The goal is a faster return to baseline after it."
    },
    {
      id:"ch-story-you-tell", type:"chapter", bookId:"book-resilience", partId:"part-foundations", order:2,
      title:"The Story You Tell",
      subtitle:"Reframing setbacks without lying to yourself",
      tags:["cognition","reframing","setbacks"], emotion:"defensive", difficulty:"foundational",
      estimatedReadingMinutes:8,
      body:[
        "Two people lose the same client. One concludes 'I'm bad at this and it's going to keep happening.' The other concludes 'that pitch missed on price — the next one needs a different angle.' Nothing about the external event changed. What changed is the story attached to it, and that story will determine whether the next attempt happens with more skill or with more fear.",
        "This happens because the mind defaults to the fastest explanation, and the fastest explanation is almost always a permanent, personal one: 'I always do this,' 'this is just who I am.' Global, permanent explanations are cognitively cheap — they require no further analysis — but they are usually wrong, because most failures have a specific, temporary, external component that a permanent story papers over.",
        "The real-life cost of the permanent story is avoidance. If a setback means something stable about your identity, the safest move is to stop trying in that domain altogether. This is why one bad public presentation can quietly end someone's willingness to speak up in meetings for years — not because the skill was truly missing, but because the story made the risk feel identity-threatening rather than skill-specific.",
        "The corrective isn't blind positivity — false comfort doesn't survive contact with a second setback. It's precision. Reframing means asking three specific questions of any failure: what part of this was actually about me, what part was situational, and what part was just information about a method that didn't work this time. Most setbacks, examined honestly, are 20% signal and 80% noise about a specific approach.",
        "Done consistently, this becomes a habit of mind rather than a technique you have to remember to use. The practical marker of progress is speed: how long it takes you, after a setback, to move from the emotional hit to a specific, next, testable action. That gap shrinking — not the absence of disappointment — is what resilience actually looks like from the inside."
      ],
      reflection:"Recall a recent setback and write the first sentence you told yourself about it. Was it a story about your identity ('I am...') or about the situation ('this approach didn't...')? Rewrite it as a specific, situational sentence.",
      exercise:"Pick one live setback from the last week. Answer in writing: (1) What part was actually about my skill or choices? (2) What part was circumstance outside my control? (3) What is one specific, different action to try next time?",
      quote:"A setback is data about a method. It only becomes a verdict on you if you let it."
    },
    {
      id:"ch-recovery-skill", type:"chapter", bookId:"book-resilience", partId:"part-foundations", order:3,
      title:"Recovery Is a Skill",
      subtitle:"Rest without guilt",
      tags:["recovery","rest","burnout"], emotion:"guilty", difficulty:"foundational",
      estimatedReadingMinutes:8,
      body:[
        "Most people treat rest as the absence of work rather than as an active input to performance. This is the root of a common pattern: someone pushes hard, feels a dip in output, interprets the dip as laziness, and pushes harder — which produces a deeper dip. The problem isn't a lack of discipline. It's a broken model of how capacity is actually replenished.",
        "Physiologically, effort depletes specific, identifiable resources — glucose availability to the prefrontal cortex, glycogen in working muscle, and the neurotransmitter systems involved in sustained attention. These do not refill through willpower. They refill through specific conditions: sleep, downtime without input, and periods with no decisions to make. Working through depletion doesn't produce more output, it produces the same output at higher error rates and higher long-term cost.",
        "In real life, this looks like the person who works a twelve-hour day and privately notices that hours nine through twelve produced almost nothing usable — yet still feels that stopping at hour eight would have been quitting. The guilt is the actual barrier, not the fatigue itself. The fatigue is honest information. The guilt is an inherited belief that rest has to be earned through suffering first.",
        "Evidence from high-performance domains — surgery, elite sport, aviation — consistently shows that scheduled recovery outperforms recovery taken only once collapse is imminent. Fatigue management is built into the schedule in advance, not negotiated with after the fact. The lesson generalizes: recovery that is planned is recovery, and recovery that is only taken in emergency is closer to damage control.",
        "The practical shift is to schedule two kinds of recovery deliberately: micro-recovery (2-10 minutes, several times a day — screen-free, decision-free) and macro-recovery (a genuine full day per week with no work-related decisions at all). Neither needs to be earned by exhaustion first. Both are inputs to the next week's capacity, the same way a rep is an input to the next set."
      ],
      reflection:"Where in your week does rest currently only happen after you've already crashed, rather than on a schedule? What would it look like to move one of those recovery moments earlier — before depletion rather than after?",
      exercise:"Schedule three micro-recovery breaks (5 minutes each, no screen) at fixed times tomorrow — not 'whenever I have a gap,' but at specific clock times. Log whether you actually took them and how output felt in the hour after each.",
      quote:"Fatigue is information. Guilt about resting is just an old rule you never agreed to."
    },
    {
      id:"ch-discipline-systems", type:"chapter", bookId:"book-resilience", partId:"part-foundations", order:4,
      title:"Discipline Systems",
      subtitle:"Removing willpower from the equation",
      tags:["discipline","habits","systems"], emotion:"determined", difficulty:"intermediate",
      estimatedReadingMinutes:9,
      body:[
        "Willpower is treated as a personality trait, when it behaves more like a battery that drains through the day with every decision made. This explains a pattern almost everyone recognizes: strong intentions in the morning, and a collapse into the path of least resistance by evening — not because the evening version of you is weaker, but because it has less decision-making capacity left to spend.",
        "Each unrelated decision — what to wear, what to answer, what to eat, what to say — draws from the same limited pool. By the time a genuinely important choice arrives, the pool is often already low, and the brain defaults to whatever requires the least additional decision-making: the couch, the snack, the scroll. This is not a character flaw. It's an entirely predictable resource curve.",
        "The practical fix is to convert repeated decisions into fixed defaults, so the depleted evening version of you never has to decide anything at all — only execute what was decided once, in advance, by the well-rested version of you. Elite performers are recognizable less by constant motivation and more by how few decisions their good habits actually require.",
        "In practice this means designing the environment rather than relying on resolve: laying out running shoes the night before, pre-deciding meals for the week, keeping a single fixed start time for a task rather than 'whenever I feel ready.' Each of these removes one decision point where willpower would otherwise have to intervene and possibly fail.",
        "The measure of a good system is that it still works on your worst day — the day with no motivation at all. A plan that only works when you feel like it isn't a system, it's a hope. Build the version of the habit that a tired, unmotivated version of you can still complete in under two minutes, and treat that minimal version as the real target, not the fallback."
      ],
      reflection:"Name one habit you keep failing at through 'trying harder.' What single decision point, if pre-made the night before, would remove the need for willpower entirely?",
      exercise:"Choose one habit you want to build. Design its two-minute minimum version (the smallest possible act that still counts) and set up the environment tonight so tomorrow's version of you only has to execute, not decide.",
      quote:"A system is a plan that still works on the day you have no motivation left."
    },
    {
      id:"ch-setback-ledger", type:"chapter", bookId:"book-resilience", partId:"part-foundations", order:5,
      title:"The Setback Ledger",
      subtitle:"Turning failure into data",
      tags:["failure","learning","reflection"], emotion:"frustrated", difficulty:"intermediate",
      estimatedReadingMinutes:8,
      body:[
        "Most setbacks are experienced once, emotionally, and then filed away without ever being examined for what they actually taught. The result is that the same category of mistake recurs every few months, each time feeling like a fresh injustice rather than a recognizable pattern — because nothing was ever written down that would let the pattern be recognized.",
        "This happens because emotional memory and analytical memory are different systems. The emotional sting of a setback is vivid and immediate, but it fades within days, taking with it the motivation to actually extract the lesson. Without a deliberate record, the brain keeps the feeling and discards the data — exactly backwards from what's useful.",
        "In practice, this shows up as people who can tell you in detail how a failure felt, but not what specifically led to it, three separate times running. A missed deadline, a strained conversation, a dropped commitment — each treated as an isolated bad day, when a five-minute written record across all three would reveal the same avoidable trigger each time.",
        "A setback ledger — a short, standing written record kept every time something goes wrong — converts the isolated bad day into a dataset. Each entry needs only four lines: what happened, what triggered it, what you'd do differently, and one word for the underlying pattern. Kept for a few months, the pattern word repeats, and the repetition itself becomes the lesson no single incident could teach alone.",
        "The discipline here is emotional as much as practical: writing the entry while the feeling is still fresh, without editing it into either an excuse or a self-attack. The ledger is not a confession or a scoreboard. It is closer to a flight log — dry, specific, and useful precisely because it resists the temptation to moralize."
      ],
      reflection:"Think of two separate setbacks from the past few months that felt unrelated at the time. Looking at them together now, is there a shared trigger or pattern you can name in one word?",
      exercise:"Write your first setback ledger entry for the most recent thing that went wrong: (1) what happened, (2) what triggered it, (3) one different action for next time, (4) one word naming the pattern. Keep this format for every setback this month.",
      quote:"A feeling fades in days. A pattern only shows up if you write it down."
    },
    {
      id:"ch-sustained-effort", type:"chapter", bookId:"book-resilience", partId:"part-foundations", order:6,
      title:"Sustained Effort",
      subtitle:"Building a resilience practice that lasts",
      tags:["consistency","practice","identity"], emotion:"resolved", difficulty:"advanced",
      estimatedReadingMinutes:10,

let state = loadState();

function loadState(){
  const saved = Storage.load();
  if(!saved) return JSON.parse(JSON.stringify(DEFAULT_STATE));
  // shallow-merge defaults for forward compatibility
  const merged = JSON.parse(JSON.stringify(DEFAULT_STATE));
  for(const k in merged){ if(saved[k] !== undefined) merged[k] = saved[k]; }
  if(saved.settings) merged.settings = Object.assign({}, DEFAULT_STATE.settings, saved.settings);
  return merged;
}

function todayKey(d){ d = d || new Date(); const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0"); return y+"-"+m+"-"+day; }
function fmtDate(k){
  const d = new Date(k+"T00:00:00");
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function renderMarkdown(raw){
  if(!raw) return "";
  let text = escapeHtml(raw);
  text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
  text = text.replace(/\*\*([^\*\n]+)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/\*([^\*\n]+)\*/g, "<em>$1</em>");
  const lines = text.split("\n");
  const out = [];
  let listBuf = [];
  function flushList(){ if(listBuf.length){ out.push("<ul>"+listBuf.map(li=>"<li>"+li+"</li>").join("")+"</ul>"); listBuf=[]; } }
  lines.forEach(line=>{
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if(h){ flushList(); const lvl = h[1].length+2; out.push(`<h${lvl} style="margin:.6em 0 .3em;font-size:${lvl===3?'1.1em':lvl===4?'1em':'.9em'};">${h[2]}</h${lvl}>`); return; }
    const li = line.match(/^[-*]\s+(.*)$/);
    if(li){ listBuf.push(li[1]); return; }
    const bq = line.match(/^>\s?(.*)$/);
    if(bq){ flushList(); out.push(`<blockquote style="margin:.4em 0;padding-left:.8em;border-left:2px solid var(--accent);color:var(--text-dim);">${bq[1]}</blockquote>`); return; }
    flushList();
    if(line.trim()==="") return;
    out.push(`<p style="margin:0 0 .6em;">${line}</p>`);
  });
  flushList();
  return out.join("\n");
}

function last14Days(){
  const arr=[];
  for(let i=13;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    arr.push(todayKey(d));
  }
  return arr;
}
function computeStreak(){
  let streak = 0;
  let d = new Date();
  while(true){
    const key = todayKey(d);
    const dp = state.dailyPractice[key];
    const done = dp && dp.read && dp.exercise;
    if(done){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

let _searchIndex = null;
function buildSearchIndex(){
  if(_searchIndex) return _searchIndex;
  const docs = [];
  CONTENT.chapters.forEach(ch=>{
    docs.push({type:"Chapters", id:ch.id, title:ch.title, text:[ch.subtitle, ...ch.body].join(" "), route:`#/reader/${ch.id}`});
    docs.push({type:"Quotes", id:ch.id+"-q", title:ch.quote, text:ch.quote, route:`#/reader/${ch.id}`});
    docs.push({type:"Exercises", id:ch.id+"-e", title:"Exercise — "+ch.title, text:ch.exercise, route:`#/reader/${ch.id}`});
  });
  state.journal.forEach(j=>{
    docs.push({type:"Journal", id:j.id, title:"Journal — "+fmtDate(j.date), text:j.text, route:`#/journal`});
  });
  CONTENT.worksheets.forEach(w=>{
    docs.push({type:"Worksheets", id:w.id, title:w.title, text:w.description+" "+w.fields.map(f=>f.label).join(" "), route:`#/worksheets/${w.id}`});
  });
  CONTENT.challenges.forEach(c=>{
    docs.push({type:"Challenges", id:c.id, title:c.title, text:c.description+" "+c.dailyAction, route:`#/challenges`});
  });
  _searchIndex = docs;
  return docs;
}

function runSearch(query){
  query = query.trim().toLowerCase();
  if(!query) return {};
  const docs = buildSearchIndex();
  const terms = query.split(/\s+/);
  const scored = docs.map(d=>{
    const hay = (d.title+" "+d.text+" "+(d.tags||[]).join(" ")).toLowerCase();
    let score = 0;
    terms.forEach(t=>{
      if(hay.includes(t)) score += (d.title.toLowerCase().includes(t) ? 3 : 1);
    });
    return {doc:d, score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);

  const grouped = {};
  scored.slice(0,30).forEach(({doc})=>{
    grouped[doc.type] = grouped[doc.type] || [];
    grouped[doc.type].push(doc);
  });
  return grouped;
}

function snippet(text, query){
  const idx = text.toLowerCase().indexOf(query.toLowerCase().split(/\s+/)[0]);
  if(idx<0) return text.slice(0,90)+"…";
  const start = Math.max(0, idx-40);
  return (start>0?"…":"") + text.slice(start, start+120) + "…";
}

function initSearch(){
  const overlay = document.getElementById("search-overlay");
  const input = document.getElementById("search-input");
  const results = document.getElementById("search-results");
  const openers = [document.getElementById("search-box")];

  function open(){
    overlay.classList.add("open");
    input.value = "";
    results.innerHTML = "";
    setTimeout(()=>input.focus(), 20);
  }
  function close(){
    overlay.classList.remove("open");
  }
  openers.forEach(el=>{
    el.addEventListener("click", open);
    el.addEventListener("keydown", e=>{ if(e.key==="Enter") open(); });
  });
  overlay.addEventListener("click", e=>{ if(e.target===overlay) close(); });
  document.addEventListener("keydown", e=>{
    if(e.key==="/" && document.activeElement.tagName!=="INPUT" && document.activeElement.tagName!=="TEXTAREA"){
      e.preventDefault(); open();
    } else if(e.key==="Escape"){
      close();
      const toc = document.getElementById("toc-panel");
      if(toc){ toc.classList.remove("open"); document.getElementById("toc-overlay").classList.remove("open"); }
      document.body.classList.remove("focus-mode");
    }
  });
  input.addEventListener("input", ()=>{
    const q = input.value;
    if(!q.trim()){ results.innerHTML=""; return; }
    const grouped = runSearch(q);
    if(!Object.keys(grouped).length){
      results.innerHTML = `<div class="search-empty">No results for "${escapeHtml(q)}"</div>`;
      return;
    }
    results.innerHTML = Object.keys(grouped).map(type=>`
      <div class="search-group">
        <h4>${type}</h4>
        ${grouped[type].map(d=>`
          <a class="search-result" href="${d.route}" data-close-search="1">
            ${escapeHtml(d.title)}
            <span class="snippet">${escapeHtml(snippet(d.text, q))}</span>
          </a>`).join("")}
      </div>`).join("");
  });
  results.addEventListener("click", e=>{
    if(e.target.closest("[data-close-search]")) close();
  });
}

          <h4>Reflection</h4>
          <p>${escapeHtml(ch.reflection)}</p>
        </div>
        <div class="block">
          <h4>Exercise</h4>
          <p>${escapeHtml(ch.exercise)}</p>
        </div>
        <div class="block">
          <h4>Your Notes</h4>
          <textarea id="chapter-note" placeholder="Write a note tied to this chapter… supports **bold**, *italic*, code spans, # headers, - lists, > quotes">${escapeHtml(noteVal)}</textarea>

          <ul>
            ${state.bookmarks.length ? state.bookmarks.map(b=>{

              return c ? `<li><a href="#/reader/${c.id}">${escapeHtml(c.title)}</a></li>` : "";

        </div>

            ).join("") : "<li>None yet.</li>"}
          </ul>
        </div>
      </aside>
    </div>
  `;

  // interactions
  document.getElementById("btn-bookmark").addEventListener("click", ()=>{
    const existing = state.bookmarks.find(b=>b.chapterId===ch.id);
    if(existing){ state.bookmarks = state.bookmarks.filter(b=>b.chapterId!==ch.id); }
    else { state.bookmarks.push({id:uid(), chapterId:ch.id, createdAt:Date.now()}); }
    persist(); renderReader(ch.id);
  });
  document.getElementById("btn-fav").addEventListener("click", ()=>{
    if(state.favorites.includes(ch.id)) state.favorites = state.favorites.filter(id=>id!==ch.id);
    else state.favorites.push(ch.id);
    persist(); renderReader(ch.id);
  });
  document.getElementById("hl-amber").addEventListener("click", ()=>{
    const selection = window.getSelection().toString();
    if(!selection){ showToast("Select some text first, then click Highlight."); return; }
    state.highlights[ch.id] = state.highlights[ch.id] || [];
    state.highlights[ch.id].push({id:uid(), color:"amber", text:selection, createdAt:Date.now()});
    persist();
    showToast("Highlight saved.");
    renderReader(ch.id);
  });
  document.getElementById("btn-print").addEventListener("click", ()=>window.print());
  document.getElementById("reader-aside").addEventListener("click", (e)=>{
    const b = e.target.closest("[data-del-hl]");
    if(!b) return;
    state.highlights[ch.id] = (state.highlights[ch.id]||[]).filter(h=>h.id!==b.dataset.delHl);
    persist(); renderReader(ch.id);
  });

  const tocPanel = document.getElementById("toc-panel");
  const tocOverlay = document.getElementById("toc-overlay");
  function openToc(){ tocPanel.classList.add("open"); tocOverlay.classList.add("open"); }
  function closeToc(){ tocPanel.classList.remove("open"); tocOverlay.classList.remove("open"); }
  document.getElementById("btn-toc").addEventListener("click", openToc);
  document.getElementById("toc-panel-close").addEventListener("click", closeToc);
  tocOverlay.addEventListener("click", closeToc);

  function setFocusMode(on){
    document.body.classList.toggle("focus-mode", on);
    document.getElementById("btn-focus") && document.getElementById("btn-focus").classList.toggle("active", on);
  }
  document.getElementById("btn-focus").addEventListener("click", ()=>setFocusMode(true));
  document.getElementById("focus-exit").addEventListener("click", ()=>setFocusMode(false));

  const SPACINGS = ["compact","comfortable","spacious"];
  document.getElementById("btn-spacing").addEventListener("click", ()=>{
    const next = SPACINGS[(SPACINGS.indexOf(state.settings.lineSpacing)+1) % SPACINGS.length];
    state.settings.lineSpacing = next;
    persist();
    renderReader(ch.id);
  });
  const WIDTHS = ["narrow","medium","wide"];
  document.getElementById("btn-width").addEventListener("click", ()=>{
    const next = WIDTHS[(WIDTHS.indexOf(state.settings.readingWidth)+1) % WIDTHS.length];
    state.settings.readingWidth = next;
    persist();
    renderReader(ch.id);
  });
  document.getElementById("chapter-note").addEventListener("input", (e)=>{
    state.notes[ch.id] = e.target.value;
    persist();
    document.getElementById("note-preview").innerHTML = renderMarkdown(e.target.value);
  });

  function updateDP(patch){
    const key = todayKey();
    state.dailyPractice[key] = Object.assign({chapterId:ch.id}, state.dailyPractice[key], patch);
    persist();
  }
  ["read","reflect","exercise","journal"].forEach(f=>{
    document.getElementById("dp-"+f).addEventListener("change", (e)=>{
      updateDP({[f]: e.target.checked});
    });
  });
  document.getElementById("btn-mark-complete").addEventListener("click", ()=>{
    state.progress[ch.id] = {status:"complete", percent:100, lastVisited:Date.now()};
    updateDP({read:true, exercise:true});
    persist();
    showToast("Chapter marked complete.");
    renderReader(ch.id);
  });

  // restore saved scroll position; progress tracking is wired once, globally
  const scroller = document.getElementById("main");
  state.session.currentChapterId = ch.id;
  scroller.scrollTop = state.session.scrollByChapter[ch.id] || 0;
}

function initScrollTracking(){
  const scroller = document.getElementById("main");
  scroller.addEventListener("scroll", ()=>{
    if(parseHash().view !== "reader") return;
    const id = state.session.currentChapterId;
    if(!id) return;
    const scrollable = scroller.scrollHeight - scroller.clientHeight;
    const pct = scrollable>0 ? Math.min(100, Math.round((scroller.scrollTop/scrollable)*100)) : 100;
    const fill = document.getElementById("reader-progress-fill");
    if(fill) fill.style.width = pct+"%";
    const p = state.progress[id];
    if(p && p.status !== "complete"){ p.percent = Math.max(p.percent||0, pct); }
    state.session.scrollByChapter[id] = scroller.scrollTop;
  }, {passive:true});
}

const JOURNAL_TYPES = [
  {id:"daily", label:"Daily Journal", prompt:null, needsChapter:false},

function getJournalType(id){ return JOURNAL_TYPES.find(t=>t.id===id) || JOURNAL_TYPES[0]; }

  main.innerHTML = `

          </div>
        </div>
        <div class="form-row">
          <label for="j-text">Entry</label>
          <textarea id="j-text" placeholder="What happened, what you noticed, what you're taking from it…"></textarea>
        </div>
        <button class="btn" id="j-save">Save entry</button>
      </div>

      <div class="tab-row" id="journal-filter-tabs">
        <button data-f="all" class="${journalFilter==='all'?'active':''}">All</button>

  const typeSelect = document.getElementById("j-type");

  function syncTypeUI(){
    const t = getJournalType(typeSelect.value);
    if(t.prompt){ promptBox.style.display="block"; promptBox.textContent = "Prompt: " + t.prompt; }
    else promptBox.style.display = "none";
    chapterRow.style.display = t.needsChapter ? "block" : "none";
  }
  typeSelect.addEventListener("change", syncTypeUI);
  syncTypeUI();

  let selectedMood = null;
  const moodBtns = document.querySelectorAll("#j-mood button");
  moodBtns.forEach(b=>b.addEventListener("click", ()=>{
    selectedMood = Number(b.dataset.val);
    moodBtns.forEach(x=>x.classList.remove("selected"));
    b.classList.add("selected");
  }));

  document.getElementById("j-save").addEventListener("click", ()=>{

    if(!text){ showToast("Write something first."); return; }
    state.journal.push({id:uid(), date, text, mood:selectedMood, type, chapterId, createdAt:Date.now()});
    persist();

}

/* -------- Knowledge Graph -------- */
function buildGraph(){
  const nodes = [];
  CHAPTERS_ORDERED.forEach((c,i)=>nodes.push({id:c.id, kind:"chapter", label:c.title, route:`#/reader/${c.id}`, tags:c.tags}));
  CONTENT.worksheets.forEach(w=>nodes.push({id:w.id, kind:"worksheet", label:w.title, route:`#/worksheets/${w.id}`, related:w.relatedChapterIds||[]}));
  CONTENT.challenges.forEach(c=>nodes.push({id:c.id, kind:"challenge", label:c.title, route:`#/challenges`, related:c.relatedChapterIds||[]}));

  const edges = [];
  const chapterNodes = nodes.filter(n=>n.kind==="chapter");
  for(let i=0;i<chapterNodes.length;i++){
    for(let j=i+1;j<chapterNodes.length;j++){
      const shared = chapterNodes[i].tags.filter(t=>chapterNodes[j].tags.includes(t));
      if(shared.length) edges.push({a:chapterNodes[i].id, b:chapterNodes[j].id, weight:shared.length});
    }
  }
  nodes.filter(n=>n.kind!=="chapter").forEach(n=>{
    (n.related||[]).forEach(rid=>edges.push({a:n.id, b:rid, weight:2}));
  });
  return {nodes, edges};
}

function renderKnowledgeGraph(){
  const main = document.getElementById("main");
  const {nodes, edges} = buildGraph();
  const W = 820, H = 560, cx = W/2, cy = H/2;

  const chapters = nodes.filter(n=>n.kind==="chapter");
  const worksheets = nodes.filter(n=>n.kind==="worksheet");
  const challenges = nodes.filter(n=>n.kind==="challenge");

  function placeRing(list, radius, startAngle){
    list.forEach((n,i)=>{
      const angle = startAngle + (i/list.length)*Math.PI*2;
      n.x = cx + radius*Math.cos(angle);
      n.y = cy + radius*Math.sin(angle);
    });
  }
  placeRing(chapters, 150, -Math.PI/2);
  placeRing(worksheets, 250, -Math.PI/2 + 0.4);
  placeRing(challenges, 250, -Math.PI/2 + 0.4 + Math.PI);

  const nodeById = {};
  nodes.forEach(n=>nodeById[n.id]=n);

  const colors = {chapter:"var(--accent)", worksheet:"var(--steel)", challenge:"var(--good)"};

  const edgeSvg = edges.map((e,i)=>{
    const a = nodeById[e.a], b = nodeById[e.b];
    if(!a || !b) return "";
    return `<line class="graph-edge" data-i="${i}" data-a="${e.a}" data-b="${e.b}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--border)" stroke-width="${1+Math.min(e.weight,3)}" opacity="0.55"></line>`;
  }).join("");

  const nodeSvg = nodes.map(n=>{
    const r = n.kind==="chapter" ? 9 : 7;
    return `<g class="graph-node" data-id="${n.id}" data-route="${n.route}" tabindex="0" role="button" aria-label="${escapeHtml(n.label)}">
      <circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${colors[n.kind]}"></circle>
      <text x="${n.x}" y="${n.y - r - 6}" text-anchor="middle">${escapeHtml(n.label.length>22 ? n.label.slice(0,20)+"…" : n.label)}</text>
    </g>`;
  }).join("");

  main.innerHTML = `
    <div class="view">
      <h1>Knowledge Graph</h1>
      <p class="lede">How the material actually connects — shared concepts between chapters, and which worksheets and challenges draw on which chapter.</p>
      <div class="graph-wrap">
        <div class="graph-legend">
          <span><i style="background:var(--accent);"></i>Chapters</span>
          <span><i style="background:var(--steel);"></i>Worksheets</span>
          <span><i style="background:var(--good);"></i>Challenges</span>
        </div>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;" id="graph-svg">
          ${edgeSvg}
          ${nodeSvg}
        </svg>
        <div id="graph-info">Hover or focus a node to see its connections. Click to open it.</div>
      </div>
    </div>
  `;

  const svg = document.getElementById("graph-svg");
  const info = document.getElementById("graph-info");

  function highlight(id){
    const connected = new Set([id]);
    edges.forEach(e=>{ if(e.a===id) connected.add(e.b); if(e.b===id) connected.add(e.a); });
    svg.querySelectorAll(".graph-node").forEach(g=>{
      g.style.opacity = connected.has(g.dataset.id) ? "1" : "0.25";
    });
    svg.querySelectorAll(".graph-edge").forEach(l=>{
      const on = l.dataset.a===id || l.dataset.b===id;
      l.setAttribute("opacity", on ? "0.95" : "0.08");
      l.setAttribute("stroke", on ? "var(--accent)" : "var(--border)");
    });
    const n = nodeById[id];
    const links = [...connected].filter(x=>x!==id).map(x=>nodeById[x] && nodeById[x].label).filter(Boolean);
    info.textContent = links.length ? `${n.label} connects to: ${links.join(", ")}` : `${n.label} — no connections yet.`;
  }
  function clearHighlight(){
    svg.querySelectorAll(".graph-node").forEach(g=>g.style.opacity="1");
    svg.querySelectorAll(".graph-edge").forEach(l=>{ l.setAttribute("opacity","0.55"); l.setAttribute("stroke","var(--border)"); });
    info.textContent = "Hover or focus a node to see its connections. Click to open it.";
  }
  svg.querySelectorAll(".graph-node").forEach(g=>{
    g.addEventListener("mouseenter", ()=>highlight(g.dataset.id));
    g.addEventListener("focus", ()=>highlight(g.dataset.id));
    g.addEventListener("mouseleave", clearHighlight);
    g.addEventListener("blur", clearHighlight);
    g.addEventListener("click", ()=>navigate(g.dataset.route.replace(/^#\//,"")));
    g.addEventListener("keydown", (e)=>{ if(e.key==="Enter") navigate(g.dataset.route.replace(/^#\//,"")); });
  });
}

/* -------- Challenges -------- */
function daysElapsed(startKey){
  const start = new Date(startKey+"T00:00:00");
  const now = new Date(todayKey()+"T00:00:00");
  return Math.floor((now-start)/86400000)+1;
}
function challengeStreak(chState){
  let streak = 0;
  let d = new Date();
  while(true){
    const key = todayKey(d);
    if(key < chState.startedAt) break;
    if(chState.checkins[key]){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}
function getActiveChallenge(){
  const active = Object.keys(state.challenges)
    .map(id=>({id, ch:getChallenge(id), st:state.challenges[id]}))
    .filter(x=>x.ch && x.st && daysElapsed(x.st.startedAt) <= x.ch.lengthDays);
  return active[0] || null;
}

function renderChallenges(){
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="view">
      <h1>Challenges</h1>
      <p class="lede">Structured programs. Each one has a single daily action — check in on the days you actually did it.</p>
      <div id="challenge-list">
        ${CONTENT.challenges.map(c=>challengeCard(c)).join("")}
      </div>
    </div>
  `;
  wireChallengeCards();
}

function challengeCard(c){
  const st = state.challenges[c.id];
  if(!st){
    return `<div class="widget" style="margin-bottom:1rem;">
      <h3>${escapeHtml(c.title)} · ${c.lengthDays} days</h3>
      <p style="color:var(--text);font-size:.92rem;margin:.3rem 0 .5rem;">${escapeHtml(c.description)}</p>
      <p style="font-size:.82rem;"><strong>Daily action:</strong> ${escapeHtml(c.dailyAction)}</p>
      <button class="btn" data-start="${c.id}" style="margin-top:.6rem;">Start Challenge</button>
    </div>`;
  }
  const elapsedRaw = daysElapsed(st.startedAt);
  const elapsed = Math.min(elapsedRaw, c.lengthDays);
  const finished = elapsedRaw > c.lengthDays;
  const checkinsCount = Object.values(st.checkins).filter(Boolean).length;
  const consistency = elapsed>0 ? Math.round((checkinsCount/elapsed)*100) : 0;
  const streak = challengeStreak(st);
  const today = todayKey();
  const checkedToday = !!st.checkins[today];

  const milestones = c.milestones.map(m=>{
    const unlocked = checkinsCount >= m.atDay;
    return `<span style="display:inline-block;padding:.3rem .6rem;border-radius:12px;font-size:.72rem;margin:0 .3rem .3rem 0;background:${unlocked?'var(--accent-soft)':'var(--bg-sunken)'};border:1px solid var(--border);color:${unlocked?'var(--ink-900)':'var(--text-dim)'};">${unlocked?'✓ ':''}${escapeHtml(m.label)}</span>`;
  }).join("");

  return `<div class="widget" style="margin-bottom:1rem;${finished?'border-color:var(--good);':'border-color:var(--accent);'}">
    <h3>${escapeHtml(c.title)} · ${finished ? "Window complete" : "Day "+elapsed+" of "+c.lengthDays}</h3>
    <p style="color:var(--text);font-size:.92rem;margin:.3rem 0 .5rem;">${escapeHtml(c.description)}</p>
    <p style="font-size:.82rem;"><strong>Daily action:</strong> ${escapeHtml(c.dailyAction)}</p>
    <div style="height:6px;background:var(--bg-sunken);border-radius:3px;overflow:hidden;margin:.6rem 0;"><div style="height:100%;width:${(elapsed/c.lengthDays)*100}%;background:${finished?'var(--good)':'var(--accent)'};"></div></div>
    <div class="stat-row" style="margin:.6rem 0;">
      <div class="stat-pill"><div class="n">${checkinsCount}</div><div class="l">Check-ins</div></div>
      <div class="stat-pill"><div class="n">${consistency}%</div><div class="l">Consistency</div></div>
      <div class="stat-pill"><div class="n">${streak}</div><div class="l">Current streak</div></div>
    </div>
    <div style="margin:.5rem 0;">${milestones}</div>
    <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem;">
      ${finished
        ? `<button class="btn" data-restart="${c.id}">Restart challenge</button>`
        : `<button class="btn ${checkedToday?'secondary':''}" data-checkin="${c.id}">${checkedToday?'✓ Checked in today':'Check in today'}</button>
           <button class="btn danger" data-abandon="${c.id}">Abandon</button>`
      }
    </div>
  </div>`;
}

function wireChallengeCards(){
  document.getElementById("challenge-list").addEventListener("click", (e)=>{
    const startBtn = e.target.closest("[data-start]");
    const checkinBtn = e.target.closest("[data-checkin]");
    const abandonBtn = e.target.closest("[data-abandon]");
    const restartBtn = e.target.closest("[data-restart]");
    if(startBtn){
      state.challenges[startBtn.dataset.start] = {startedAt: todayKey(), checkins:{}};
      persist(); showToast("Challenge started."); renderChallenges();
    }
    if(checkinBtn){
      const id = checkinBtn.dataset.checkin;
      const st = state.challenges[id];
      const key = todayKey();
      st.checkins[key] = !st.checkins[key];
      persist(); renderChallenges();
    }
    if(abandonBtn){
      if(confirm("Abandon this challenge? Your check-in history for it will be cleared.")){
        delete state.challenges[abandonBtn.dataset.abandon];
        persist(); renderChallenges();
      }
    }
    if(restartBtn){
      state.challenges[restartBtn.dataset.restart] = {startedAt: todayKey(), checkins:{}};
      persist(); showToast("Challenge restarted."); renderChallenges();
    }
  });
}

function renderTrackerChart(type){
  const days = last14Days();
  const tracker = TRACKER_TYPES.find(t=>t.id===type);

  const bars = days.map(k=>{
    const entry = state.trackers.filter(t=>t.trackerType===type && t.date===k).slice(-1)[0];

    const hi = entry && entry.value/max > 0.6 ? "hi" : "";
    return `<div class="bar ${hi}" style="height:${h}%" title="${fmtDate(k)}: ${entry?entry.value:'—'}"></div>`;
  }).join("");
  const labels = days.map((k,i)=> i%3===0 ? `<span>${fmtDate(k)}</span>` : `<span></span>`).join("");
  return `<div class="bar-chart">${bars}</div><div class="bar-chart-labels">${labels}</div>`;
}

function reportRange(period){
  const days = period==="today" ? 1 : period==="week" ? 7 : 30;
  const keys = [];
  for(let i=days-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); keys.push(todayKey(d)); }
  return keys;
}

function generateReport(period){
  const keys = reportRange(period);
  const keySet = new Set(keys);
  const journalEntries = state.journal.filter(j=>keySet.has(j.date));
  const trackerEntries = state.trackers.filter(t=>keySet.has(t.date));
  const worksheetCount = Object.values(state.worksheetEntries).flat().filter(e=>keySet.has(e.date)).length;
  const practiceDays = keys.filter(k=>{ const dp=state.dailyPractice[k]; return dp && dp.read && dp.exercise; }).length;
  const chaptersTouched = Object.keys(state.progress).filter(id=>{
    const p = state.progress[id];
    return p.lastVisited && keys.includes(todayKey(new Date(p.lastVisited)));
  }).map(id=>getChapter(id)).filter(Boolean);
  const trackerAverages = TRACKER_TYPES.map(t=>{
    const entries = trackerEntries.filter(e=>e.trackerType===t.id);
    const avg = entries.length ? (entries.reduce((s,e)=>s+e.value,0)/entries.length).toFixed(1) : null;
    return {label:t.label, avg, count:entries.length};
  });
  return {period, keys, journalEntries, trackerEntries, worksheetCount, practiceDays, chaptersTouched, trackerAverages};
}

/* ---------- accessibility: live region + focus trap ---------- */
function announce(msg){
  let lr = document.getElementById("a11y-live");
  if(!lr){ lr=document.createElement("div"); lr.id="a11y-live"; lr.className="sr-only"; lr.setAttribute("aria-live","polite"); document.body.appendChild(lr); }
  lr.textContent = msg;
}
function trapFocus(e, box){
  const items = box.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])');
  if(!items.length) return;
  const first=items[0], last=items[items.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}

/* ---------- modal system (replaces native confirm/prompt) ---------- */
function xModal(html, opts){
  opts = opts || {};
  const ov = document.createElement("div");
  ov.className = "x-overlay";
  ov.innerHTML = '<div class="x-modal" role="dialog" aria-modal="true">'+html+'</div>';
  document.body.appendChild(ov);
  const box = ov.querySelector(".x-modal");
  const prev = document.activeElement;
  function close(){ document.removeEventListener("keydown", onKey, true); ov.remove(); if(prev && prev.focus) try{ prev.focus(); }catch(_){} if(opts.onClose) opts.onClose(); }
  function onKey(e){
    if(e.key==="Escape"){ e.preventDefault(); close(); if(opts.onEscape) opts.onEscape(); }
    else if(e.key==="Tab"){ trapFocus(e, box); }
  }
  document.addEventListener("keydown", onKey, true);
  ov.addEventListener("click", e=>{ if(e.target===ov){ close(); if(opts.onEscape) opts.onEscape(); } });
  const first = box.querySelector("[data-autofocus],input,textarea,select,button");
  if(first) setTimeout(()=>{ try{ first.focus(); }catch(_){} },20);
  return { el:box, close };
}
function xConfirm(message, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    const m = xModal(
      '<h3>'+escapeHtml(opts.title||"Please confirm")+'</h3><p>'+escapeHtml(message)+'</p>'+
      '<div class="x-actions"><button class="btn secondary" data-no>'+escapeHtml(opts.cancelLabel||"Cancel")+'</button>'+
      '<button class="btn '+(opts.danger?'danger':'')+'" data-yes data-autofocus>'+escapeHtml(opts.confirmLabel||"Confirm")+'</button></div>',
      { onEscape:()=>resolve(false) }
    );
    m.el.querySelector("[data-yes]").addEventListener("click", ()=>{ m.close(); resolve(true); });
    m.el.querySelector("[data-no]").addEventListener("click", ()=>{ m.close(); resolve(false); });
  });
}
function xPrompt(message, def, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    const m = xModal(
      '<h3>'+escapeHtml(opts.title||"Enter a value")+'</h3><p>'+escapeHtml(message)+'</p>'+
      '<input type="'+(opts.type||"text")+'" value="'+escapeHtml(def||"")+'" data-in data-autofocus>'+
      '<div class="x-actions"><button class="btn secondary" data-no>Cancel</button><button class="btn" data-yes>OK</button></div>',
      { onEscape:()=>resolve(null) }
    );
    const input = m.el.querySelector("[data-in]");
    m.el.querySelector("[data-yes]").addEventListener("click", ()=>{ const v=input.value; m.close(); resolve(v); });
    m.el.querySelector("[data-no]").addEventListener("click", ()=>{ m.close(); resolve(null); });
    input.addEventListener("keydown", e=>{ if(e.key==="Enter"){ const v=input.value; m.close(); resolve(v); } });
  });
}

/* ---------- app lock (PIN + WebCrypto) ---------- */
async function deriveBits(pin, saltB64, iterations){
  const enc = new TextEncoder();
  const salt = Uint8Array.from(atob(saltB64), c=>c.charCodeAt(0));
  const key = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt, iterations: iterations||150000, hash:"SHA-256"}, key, 256);
  return btoa(String.fromCharCode.apply(null, new Uint8Array(bits)));
}
async function setLock(pin){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const saltB64 = btoa(String.fromCharCode.apply(null, salt));
  const hash = await deriveBits(pin, saltB64);
  state.settings.lock = { salt:saltB64, hash, iterations:150000 };
  persist();
}
async function checkLock(pin){
  const l = state.settings.lock;
  if(!l) return true;
  const hash = await deriveBits(pin, l.salt, l.iterations);
  return hash === l.hash;
}

/* ---------- encryption of backups (AES-GCM + PBKDF2) ---------- */
async function encryptText(plain, pass){
  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt"]);
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(plain));
  const pack = { v:1, alg:"AES-GCM", kdf:"PBKDF2-150k-SHA256",
    salt:btoa(String.fromCharCode.apply(null,salt)), iv:btoa(String.fromCharCode.apply(null,iv)),
    data:btoa(String.fromCharCode.apply(null,new Uint8Array(ct))) };
  return JSON.stringify(pack, null, 2);
}
async function decryptText(packStr, pass){
  const p = JSON.parse(packStr);
  const dec = new TextDecoder();
  const salt = Uint8Array.from(atob(p.salt), c=>c.charCodeAt(0));
  const iv = Uint8Array.from(atob(p.iv), c=>c.charCodeAt(0));
  const data = Uint8Array.from(atob(p.data), c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, data);
  return dec.decode(pt);
}

/* ---------- import with validation + merge ---------- */
function validateBackup(obj){
  const report = { ok:true, problems:[] };
  if(!obj || typeof obj!=="object"){ report.ok=false; report.problems.push("Not a JSON object."); return report; }
  if(!("settings" in obj)){ report.ok=false; report.problems.push("Missing 'settings' — not a Conqueror OS backup."); }
  ["journal","trackers","bookmarks"].forEach(k=>{ if(obj[k]!==undefined && !Array.isArray(obj[k])) report.problems.push("'"+k+"' should be an array; will be ignored."); });
  return report;
}
async function importBackup(text, mode){
  let obj;
  try{ obj = JSON.parse(text); }catch(e){ showToast("That file is not valid JSON."); return; }
  const rep = validateBackup(obj);
  if(!rep.ok){ showToast(rep.problems[0]||"Invalid backup."); return; }
  if(mode==="merge"){
    pushUndo(()=>{});
    const before = JSON.parse(JSON.stringify(state));
    const seen = new Set((state.journal||[]).map(j=>j.id));
    (obj.journal||[]).forEach(j=>{ if(!seen.has(j.id)){ state.journal.push(j); seen.add(j.id); } });
    const tseen = new Set((state.trackers||[]).map(t=>t.id));
    (obj.trackers||[]).forEach(t=>{ if(!tseen.has(t.id)){ state.trackers.push(t); tseen.add(t.id); } });
    const bseen = new Set((state.bookmarks||[]).map(b=>b.id));
    (obj.bookmarks||[]).forEach(b=>{ if(!bseen.has(b.id)){ state.bookmarks.push(b); bseen.add(b.id); } });
    for(const id in (obj.highlights||{})){ state.highlights[id] = (state.highlights[id]||[]).concat(obj.highlights[id]||[]); }
    for(const id in (obj.notes||{})){ if(!state.notes[id]) state.notes[id]=obj.notes[id]; }
    state.trackerDefs = (state.trackerDefs||[]).concat((obj.trackerDefs||[]).filter(d=>!state.trackerDefs.some(x=>x.id===d.id)));
    state.challengeDefs = (state.challengeDefs||[]).concat((obj.challengeDefs||[]).filter(d=>!state.challengeDefs.some(x=>x.id===d.id)));
    persist();
    toastAction("Imported and merged.","Undo",()=>{ state=before; persist(); render(); });
    announce("Import merged.");
    render();
  } else {
    pushUndo(()=>{});
    const before = JSON.parse(JSON.stringify(state));
    state = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), obj);
    state.schemaVersion = SCHEMA_VERSION;
    persist(); applyTheme();
    toastAction("Backup restored (replaced).","Undo",()=>{ state=before; persist(); applyTheme(); render(); });
    render();
  }
}

function openPalette(){
  const items = [];
  NAV_ITEMS.forEach(n=>items.push({label:"Go to "+n.label, run:()=>navigate(n.id)}));
  CHAPTERS_ORDERED.forEach(c=>items.push({label:"Open chapter: "+c.title, run:()=>navigate("reader/"+c.id)}));

  items.push({label:"Export backup (JSON)", run:exportPlainBackup});
  items.push({label:"Export Markdown", run:exportMarkdown});
  items.push({label:"Export encrypted backup", run:exportEncrypted});
  items.push({label:"Toggle theme", run:()=>{ state.settings.theme = effectiveTheme()==="dark"?"light":"dark"; applyTheme(); persist(); }});
  items.push({label:"Keyboard shortcuts", run:openShortcuts});
  items.push({label:"Settings", run:()=>navigate("settings")});

  const m = xModal('<input type="text" data-q placeholder="Type a command…" data-autofocus><div class="palette-list" data-list></div>', {title:"Command palette"});
  const q = m.el.querySelector("[data-q]"), list = m.el.querySelector("[data-list]");
  let sel = 0, view = items;
  function draw(){
    list.innerHTML = view.slice(0,40).map((it,i)=>'<button class="palette-item'+(i===sel?" sel":"")+'" data-i="'+i+'">'+escapeHtml(it.label)+'</button>').join("") || '<div class="palette-empty">No matches</div>';
  }
  function filter(){
    const t=q.value.trim().toLowerCase();
    view = t ? items.filter(it=>it.label.toLowerCase().includes(t)) : items;
    sel = 0; draw();
  }
  q.addEventListener("input", filter);
  q.addEventListener("keydown", e=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); sel=Math.min(sel+1, Math.min(view.length,40)-1); draw(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); sel=Math.max(sel-1,0); draw(); }
    else if(e.key==="Enter"){ e.preventDefault(); const it=view[sel]; if(it){ m.close(); it.run(); } }
  });
  list.addEventListener("click", e=>{ const b=e.target.closest("[data-i]"); if(b){ const it=view[+b.dataset.i]; m.close(); it.run(); } });
  draw();
}

/* ---------- markdown (adds [[wiki links]] and checkboxes) ---------- */
renderMarkdown = function(raw){
  if(!raw) return "";
  let text = escapeHtml(raw);
  // wiki links: [[Chapter Title]] or [[chapter-id]]
  text = text.replace(/\[\[([^\]]+)\]\]/g, (m0, inner)=>{
    const key = inner.trim();
    const ch = getChapter(key) || CHAPTERS_ORDERED.find(c=>c.title.toLowerCase()===key.toLowerCase());
    if(ch) return '<a class="wiki" href="#/reader/'+ch.id+'">'+escapeHtml(ch.title)+'</a>';
    return '<span class="wiki missing" title="No matching chapter">'+escapeHtml(key)+'</span>';
  });
  text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
  text = text.replace(/\*\*([^\*\n]+)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/\*([^\*\n]+)\*/g, "<em>$1</em>");
  const lines = text.split("\n");
  const out = []; let listBuf=[];
  function flushList(){ if(listBuf.length){ out.push("<ul>"+listBuf.map(li=>"<li>"+li+"</li>").join("")+"</ul>"); listBuf=[]; } }
  lines.forEach(line=>{
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if(h){ flushList(); const lvl=h[1].length+2; out.push('<h'+lvl+' style="margin:.6em 0 .3em;font-size:'+(lvl===3?'1.1em':lvl===4?'1em':'.9em')+';">'+h[2]+'</h'+lvl+'>'); return; }
    const li = line.match(/^[-*]\s+(.*)$/);
    if(li){ listBuf.push(li[1]); return; }
    const bq = line.match(/^>\s?(.*)$/);
    if(bq){ flushList(); out.push('<blockquote style="margin:.4em 0;padding-left:.8em;border-left:2px solid var(--accent);color:var(--text-dim);">'+bq[1]+'</blockquote>'); return; }
    flushList();
    if(line.trim()==="") return;
    out.push('<p style="margin:0 0 .6em;">'+line+'</p>');
  });
  flushList();
  return out.join("\n");
};

function relatedWorksheets(cid){ return CONTENT.worksheets.filter(w=>(w.relatedChapterIds||[]).includes(cid)); }
function relatedChallenges(cid){ return allChallengeDefs().filter(c=>(c.relatedChapterIds||[]).includes(cid)); }

function applyHighlightsToArticle(article, chapterId){
  try{
  const hls = (state.highlights[chapterId]||[]).filter(h=>h.text);
  if(!hls.length) return;
  hls.forEach(h=>{
    const walker = document.createTreeWalker(article, NodeFilter.SHOW_TEXT, null);
    let node;
    while(node = walker.nextNode()){
      if(node.__hlDone) continue;
      const idx = node.nodeValue.indexOf(h.text);
      if(idx<0) continue;
      try{
        const after = node.splitText(idx);
        const mid = after.splitText(h.text.length);
        const mark = document.createElement("mark");
        mark.className = "hl hl-"+h.color;
        mark.setAttribute("data-hl-id", h.id);
        mark.setAttribute("title", h.note || "Click to edit");
        mark.textContent = after.nodeValue;
        after.parentNode.replaceChild(mark, after);
        node.__hlDone = true;
      }catch(_){}
      break;
    }
  });
  }catch(_){ /* highlight rendering is best-effort */ }
}

/* ---------- read aloud ---------- */
function toggleTTS(ch){
  if(!("speechSynthesis" in window)){ showToast("Read-aloud isn't supported here."); return; }
  if(window.speechSynthesis.speaking){ window.speechSynthesis.cancel(); showToast("Stopped."); return; }
  const u = new SpeechSynthesisUtterance(ch.body.join("\n\n"));
  u.rate = 1; u.pitch = 1;
  window.speechSynthesis.speak(u);
  showToast("Reading aloud — click Read aloud again to stop.");
}

/* ---------- dwell tracking ---------- */
function startDwell(chapterId){
  readerChapter = chapterId;
  readerStart = Date.now();
  if(readerTimer) clearInterval(readerTimer);
  readerTimer = setInterval(()=>flushDwell(), 20000);
  window.addEventListener("beforeunload", flushDwell);
  window.addEventListener("pagehide", flushDwell);
}
function flushDwell(){
  if(!readerChapter || !readerStart) return;
  const secs = Math.round((Date.now()-readerStart)/1000);
  readerStart = Date.now();
  if(secs<3) return;
  const p = state.progress[readerChapter] || {status:"in-progress", percent:0};
  p.seconds = (p.seconds||0) + secs;
  state.progress[readerChapter] = p;
  state.readingLog = state.readingLog || {};
  const k = todayKey();
  state.readingLog[k] = Math.round((state.readingLog[k]||0) + secs/60);
  persist();
}
