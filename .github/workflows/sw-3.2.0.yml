name: sw-3.2.0

# One-shot tool: registers the service worker in the app (issue #12), proves it
# with the repo's own suites, rebuilds the committed outputs and opens a PR that
# deletes this file again. It sits on main only because workflow_dispatch cannot
# start a workflow that is not there - the same pattern as repair-src.yml.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply the change
        run: |
          python3 - <<'PYAPPLY'
          import json, pathlib
          R = pathlib.Path(".")
          p = (R / "src/index.html").read_text(encoding="utf-8")
          a = "connect-src 'none'; object-src 'none'"
          assert a in p, "CSP anchor missing"
          p = p.replace(a, "connect-src 'none'; worker-src 'self'; object-src 'none'", 1)
          reg = '''<script>
          /* Optional service worker: offline when SERVED over http(s). Opened from disk
             nothing happens - a worker needs an origin, and this file is already offline.
             Registration failure is never fatal: nothing depends on the worker. */
          (function(){
            if(!('serviceWorker' in navigator)) return;
            var protocol = location.protocol;
            if(protocol !== 'https:' && protocol !== 'http:') return;
            window.addEventListener('load', function(){
              try{ navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(_){}
            });
          })();
          </script>
          </body>
          </html>'''
          b = "</body>\n</html>"
          assert b in p, "tail anchor missing"
          (R / "src/index.html").write_text(p.replace(b, reg, 1), encoding="utf-8")
          pkg = json.loads((R / "package.json").read_text())
          pkg["version"] = "3.2.0"
          pkg["scripts"]["test:sw"] = "node tests/sw.test.js"
          pkg["scripts"]["test"] = "node tests/smoke.test.js && node tests/sw.test.js"
          (R / "package.json").write_text(json.dumps(pkg, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          lock = (R / "package-lock.json").read_text().replace('"version": "3.1.1"', '"version": "3.2.0"')
          (R / "package-lock.json").write_text(lock, encoding="utf-8")
          rd = (R / "docs/ROADMAP.md").read_text()
          item = "- **Optional service worker** \u2014 installable/offline caching when the app is served over HTTP. *Limitation:* a service worker requires an origin, so it cannot be offered when the file is opened from disk; the app already works offline in that case.\n"
          assert item in rd, "roadmap item missing"
          rd = rd.replace(item, "")
          anchor = "- **Review scheduling options** \u2014 a configurable daily review cap and first/second review intervals (Settings \u2192 Review).\n"
          assert anchor in rd
          shipped = "- **Optional service worker (3.2.0)** \u2014 served over http(s) the app registers `sw.js`: cache-first for same-origin GETs, a cache named for the release so a new version cannot serve the old shell, nothing else intercepted. Opened from disk it is unchanged. *Still true:* installability is the browser's call and Chrome also wants a manifest, which this app does not ship.\n"
          (R / "docs/ROADMAP.md").write_text(rd.replace(anchor, anchor + shipped), encoding="utf-8")
          rm = (R / "README.md").read_text()
          old = "See [`docs/ROADMAP.md`](docs/ROADMAP.md). Near-term themes: an optional service worker for installable use (when served over HTTP), Hindi/Gujarati localisation, and optional end-to-end sync via an export file."
          assert old in rm, "readme anchor missing"
          new = "See [`docs/ROADMAP.md`](docs/ROADMAP.md). Near-term themes: Hindi/Gujarati localisation, reading goals, and optional end-to-end sync via an export file. The optional service worker shipped in 3.2.0: served over HTTP the app caches its own shell and opens with the network off."
          (R / "README.md").write_text(rm.replace(old, new), encoding="utf-8")
          ch = (R / "CHANGELOG.md").read_text()
          head = "## [Unreleased]\n"
          assert head in ch
          entry = '''
          ## [3.2.0] \u2014 2026-11-04

          ### Added \u2014 optional service worker: offline over HTTP, unchanged from disk
          - `docs/play/sw.js` \u2014 cache-first for same-origin GETs and nothing else; cross-origin and non-GET requests are left to the browser. The cache is named for the release, so a new worker cannot serve the old shell; a navigation that misses the cache and finds no network still opens the cached shell.
          - `src/index.html` \u2014 registration guarded on `serviceWorker` presence *and* protocol, so opening the file from disk does nothing; a failed registration is caught. The CSP gains `worker-src 'self'` and nothing else: `default-src 'none'` and `connect-src 'none'` still hold.
          - `tests/sw.test.js` \u2014 21 assertions that drive the worker's install / activate / fetch handlers against a stub Cache API and stub fetch, not a file-exists check. Wired into `npm test`.
          - Honest limit: installability is the browser's decision and Chrome also requires a manifest, which this app does not ship \u2014 the worker buys offline loading, not an install prompt.
          - Version 3.2.0; `npm run build` regenerated `dist/conqueror-os.html`, the Pages `index.html` and `docs/play/index.html`.
          '''
          (R / "CHANGELOG.md").write_text(ch.replace(head, head + entry, 1), encoding="utf-8")
          print("applied")
          PYAPPLY
      - name: Prove it with the repo's own suites
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node tests/smoke.test.js
          node tests/sw.test.js
          npm run build
          cp index.html docs/play/index.html
          if git diff --quiet -- src/index.html; then echo "::error::src/index.html did not change"; exit 1; fi
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "forge-bot"
          git config user.email "forge-bot@users.noreply.github.com"
          BR=feat/sw-3.2.0
          git checkout -b "$BR"
          git rm -q .github/workflows/sw-3.2.0.yml
          git add -A
          printf '%s\n' 'feat(3.2.0): optional service worker - offline over HTTP, unchanged from disk' > /tmp/msg.txt
          git commit -F /tmp/msg.txt
          git push -u origin "$BR"
          cat > /tmp/pr.md <<'PRBODY'
          Closes #12.

          Served over http(s) the app now registers `sw.js`: cache-first for same-origin GETs, a cache named for the release so a new worker cannot serve the old shell, and nothing else intercepted. Opened from disk it is unchanged - a worker needs an origin and the single file is already offline.

          **Proof, from this run:** `node tests/smoke.test.js` and `node tests/sw.test.js` both ran green before the commit, and `npm run build` regenerated `dist/conqueror-os.html`, the Pages `index.html` and `docs/play/index.html`, so `dist-in-sync` stays green.

          **Honest limit:** installability is the browser's call and Chrome additionally wants a manifest, which this app does not ship - the worker buys offline loading, not an install prompt.

          This PR deletes `.github/workflows/sw-3.2.0.yml`, the one-shot tool that produced it.
          PRBODY
          gh pr create --base main --head "$BR" --title 'feat(3.2.0): optional service worker - offline over HTTP, unchanged from disk' --body-file /tmp/pr.md
