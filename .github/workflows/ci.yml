name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # was @v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # was @v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      - name: Run smoke suite
        run: npm test

      - name: Build single-file app
        run: npm run build

      - name: Verify build output exists
        run: test -s dist/conqueror-os.html

      - name: Upload build artifact
        if: matrix.node == 20
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # was @v7
        with:
          name: conqueror-os-dist
          path: dist/conqueror-os.html
          if-no-files-found: error

  dist-in-sync:
    name: dist/ is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # was @v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # was @v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Fail if build output differs from committed build
        run: |
          if ! git diff --quiet -- dist/conqueror-os.html index.html; then
            echo "::error::dist/conqueror-os.html and/or index.html are out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist/conqueror-os.html index.html
            exit 1
          fi
