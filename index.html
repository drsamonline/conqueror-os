assign({},e,{schemaVersion:1,exportedAt:(new Date).toISOString()});return JSON.stringify(t,null,2)},restoreBackup(e){try{const t=JSON.parse(e);if(!t||"object"!=typeof t||!("settings"in t))throw new Error("Not a recognizable Conqueror OS backup.");return t}catch(e){throw new Error("Invalid backup file: "+e.message)}}},n={books:[{id:"book-resilience",type:"book",title:"The Resilience Protocol",subtitle:"A working system for staying functional under pressure",description:"Six chapters on how stress actually works in the body and mind, and the concrete practices that convert pressure into capability instead of damage.",tags:["resilience","stress","discipline"],estimatedReadingMinutes:52}],parts:[{id:"part-foundations",type:"part",bookId:"book-resilience",title:"Part I — Foundations",order:1}],chapters:[{id:"ch-stress-response",type:"chapter",bookId:"book-resilience",partId:"part-foundations",order:1,title:"The Stress Response",subtitle:"Why pressure feels like danger",tags:["stress","physiology","fight-or-flight"],emotion:"tense",difficulty:"foundational",estimatedReadingMinutes:9,body:["The problem is simple to name and hard to live with: your body cannot tell the difference between a deadline and a physical threat. A late invoice, a difficult conversation, an exam — the same alarm system fires as if a predator had just stepped into the room. Heart rate climbs, breathing shortens, attention narrows. None of this is a malfunction. It is the oldest survival software you own, running exactly as designed.","This happens because the response evolved for a world of immediate physical danger, not sustained modern pressure. A rush of cortisol and adrenaline was built to get you through minutes, not months. It sharpens short-term focus and strength at the direct cost of digestion, long-term planning, and immune function. When the trigger is a single sprint from a threat, that trade is a bargain. When the trigger is an inbox that refills every morning, the same trade quietly bankrupts you.","In real life this shows up as people who describe themselves as 'wired but tired' — unable to relax, unable to sleep, unable to fully finish the thought that started the tension in the first place. The body stays in a low simmer of alert readiness long after the meeting ended or the email was sent. Over months, this shows up as tight shoulders, shallow breathing become a habit, and a baseline irritability that has nothing to do with any single event.","The useful reframe is that stress is not the enemy — an unregulated stress response is. Elite performers in high-pressure fields are not people who feel less activation; they are people who have practiced returning to baseline faster. The skill being trained is not calmness at rest, it is recovery speed after activation. That is a trainable variable, not a fixed trait.","The most direct lever is the breath, because it is the one part of the stress response you can operate manually. A slower exhale than inhale (for example, four counts in, six counts out) directly signals the vagus nerve to shift the body out of alert mode. This is not a metaphor or a mood trick — it is a mechanical override available to you in real time, in a meeting, at a desk, before you speak."],reflection:"Think of the last time your body reacted to a non-physical threat as if it were physical. Where did you feel it first — chest, jaw, stomach, hands? Write one sentence describing the earliest physical signal you get before you consciously notice you're stressed.",exercise:"Practice the 4-6 breath (4 counts in through the nose, 6 counts out through the mouth) for two minutes, three times today: once before something you're dreading, once during it if possible, and once after. Log how activated you felt (1-10) before and after each round.",quote:"The goal is not a life without pressure. The goal is a faster return to baseline after it."},{id:"ch-story-you-tell",type:"chapter",bookId:"book-resilience",partId:"part-foundations",order:2,title:"The Story You Tell",subtitle:"Reframing setbacks without lying to yourself",tags:["cognition","reframing","setbacks"],emotion:"defensive",difficulty:"foundational",estimatedReadingMinutes:8,body:["Two people lose the same client. One concludes 'I'm bad at this and it's going to keep happening.' The other concludes 'that pitch missed on price — the next one needs a different angle.' Nothing about the external event changed. What changed is the story attached to it, and that story will determine whether the next attempt happens with more skill or with more fear.","This happens because the mind defaults to the fastest explanation, and the fastest explanation is almost always a permanent, personal one: 'I always do this,' 'this is just who I am.' Global, permanent explanations are cognitively cheap — they require no further analysis — but they are usually wrong, because most failures have a specific, temporary, external component that a permanent story papers over.","The real-life cost of the permanent story is avoidance. If a setback means something stable about your identity, the safest move is to stop trying in that domain altogether. This is why one bad public presentation can quietly end someone's willingness to speak up in meetings for years — not because the skill was truly missing, but because the story made the risk feel identity-threatening rather than skill-specific.","The corrective isn't blind positivity — false comfort doesn't survive contact with a second setback. It's precision. Reframing means asking three specific questions of any failure: what part of this was actually about me, what part was situational, and what part was just information about a method that didn't work this time. Most setbacks, examined honestly, are 20% signal and 80% noise about a specific approach.","Done consistently, this becomes a habit of mind rather than a technique you have to remember to use. The practical marker of progress is speed: how long it takes you, after a setback, to move from the emotional hit to a specific, next, testable action. That gap shrinking — not the absence of disappointment — is what resilience actually looks like from the inside."],reflection:"Recall a recent setback and write the first sentence you told yourself about it. Was it a story about your identity ('I am...') or about the situation ('this approach didn't...')? Rewrite it as a specific, situational sentence.",exercise:"Pick one live setback from the last week. Answer in writing: (1) What part was actually about my skill or choices? (2) What part was circumstance outside my control? (3) What is one specific, different action to try next time?",quote:"A setback is data about a method. It only becomes a verdict on you if you let it."},{id:"ch-recovery-skill",type:"chapter",bookId:"book-resilience",partId:"part-foundations",order:3,title:"Recovery Is a Skill",subtitle:"Rest without guilt",tags:["recovery","rest","burnout"],emotion:"guilty",difficulty:"foundational",estimatedReadingMinutes:8,body:["Most people treat rest as the absence of work rather than as an active input to performance. This is the root of a common pattern: someone pushes hard, feels a dip in output, interprets the dip as laziness, and pushes harder — which produces a deeper dip. The problem isn't a lack of discipline. It's a broken model of how capacity is actually replenished.","Physiologically, effort depletes specific, identifiable resources — glucose availability to the prefrontal cortex, glycogen in working muscle, and the neurotransmitter systems involved in sustained attention. These do not refill through willpower. They refill through specific conditions: sleep, downtime without input, and periods with no decisions to make. Working through depletion doesn't produce more output, it produces the same output at higher error rates and higher long-term cost.","In real life, this looks like the person who works a twelve-hour day and privately notices that hours nine through twelve produced almost nothing usable — yet still feels that stopping at hour eight would have been quitting. The guilt is the actual barrier, not the fatigue itself. The fatigue is honest information. The guilt is an inherited belief that rest has to be earned through suffering first.","Evidence from high-performance domains — surgery, elite sport, aviation — consistently shows that scheduled recovery outperforms recovery taken only once collapse is imminent. Fatigue management is built into the schedule in advance, not negotiated with after the fact. The lesson generalizes: recovery that is planned is recovery, and recovery that is only taken in emergency is closer to damage control.","The practical shift is to schedule two kinds of recovery deliberately: micro-recovery (2-10 minutes, several times a day — screen-free, decision-free) and macro-recovery (a genuine full day per week with no work-related decisions at all). Neither needs to be earned by exhaustion first. Both are inputs to the next week's capacity, the same way a rep is an input to the next set."],reflection:"Where in your week does rest currently only happen after you've already crashed, rather than on a schedule? What would it look like to move one of those recovery moments earlier — before depletion rather than after?",exercise:"Schedule three micro-recovery breaks (5 minutes each, no screen) at fixed times tomorrow — not 'whenever I have a gap,' but at specific clock times. Log whether you actually took them and how output felt in the hour after each.",quote:"Fatigue is information. Guilt about resting is just an old rule you never agreed to."},{id:"ch-discipline-systems",type:"chapter",bookId:"book-resilience",partId:"part-foundations",order:4,title:"Discipline Systems",subtitle:"Removing willpower from the equation",tags:["discipline","habits","systems"],emotion:"determined",difficulty:"intermediate",estimatedReadingMinutes:9,body:["Willpower is treated as a personality trait, when it behaves more like a battery that drains through the day with every decision made. This explains a pattern almost everyone recognizes: strong intentions in the morning, and a collapse into the path of least resistance by evening — not because the evening version of you is weaker, but because it has less decision-making capacity left to spend.","Each unrelated decision — what to wear, what to answer, what to eat, what to say — draws from the same limited pool. By the time a genuinely important choice arrives, the pool is often already low, and the brain defaults to whatever requires the least additional decision-making: the couch, the snack, the scroll. This is not a character flaw. It's an entirely predictable resource curve.","The practical fix is to convert repeated decisions into fixed defaults, so the depleted evening version of you never has to decide anything at all — only execute what was decided once, in advance, by the well-rested version of you. Elite performers are recognizable less by constant motivation and more by how few decisions their good habits actually require.","In practice this means designing the environment rather than relying on resolve: laying out running shoes the night before, pre-deciding meals for the week, keeping a single fixed start time for a task rather than 'whenever I feel ready.' Each of these removes one decision point where willpower would otherwise have to intervene and possibly fail.","The measure of a good system is that it still works on your worst day — the day with no motivation at all. A plan that only works when you feel like it isn't a system, it's a hope. Build the version of the habit that a tired, unmotivated version of you can still complete in under two minutes, and treat that minimal version as the real target, not the fallback."],reflection:"Name one habit you keep failing at through 'trying harder.' What single decision point, if pre-made the night before, would remove the need for willpower entirely?",exercise:"Choose one habit you want to build. Design its two-minute minimum version (the smallest possible act that still counts) and set up the environment tonight so tomorrow's version of you only has to execute, not decide.",quote:"A system is a plan that still works on the day you have no motivation left."},{id:"ch-setback-ledger",type:"chapter",bookId:"book-resilience",partId:"part-foundations",order:5,title:"The Setback Ledger",subtitle:"Turning failure into data",tags:["failure","learning","reflection"],emotion:"frustrated",difficulty:"intermediate",estimatedReadingMinutes:8,body:["Most setbacks are experienced once, emotionally, and then filed away without ever being examined for what they actually taught. The result is that the same category of mistake recurs every few months, each time feeling like a fresh injustice rather than a recognizable pattern — because nothing was ever written down that would let the pattern be recognized.","This happens because emotional memory and analytical memory are different systems. The emotional sting of a setback is vivid and immediate, but it fades within days, taking with it the motivation to actually extract the lesson. Without a deliberate record, the brain keeps the feeling and discards the data — exactly backwards from what's useful.","In practice, this shows up as people who can tell you in detail how a failure felt, but not what specifically led to it, three separate times running. A missed deadline, a strained conversation, a dropped commitment — each treated as an isolated bad day, when a five-minute written record across all three would reveal the same avoidable trigger each time.","A setback ledger — a short, standing written record kept every time something goes wrong — converts the isolated bad day into a dataset. Each entry needs only four lines: what happened, what triggered it, what you'd do differently, and one word for the underlying pattern. Kept for a few months, the pattern word repeats, and the repetition itself becomes the lesson no single incident could teach alone.","The discipline here is emotional as much as practical: writing the entry while the feeling is still fresh, without editing it into either an excuse or a self-attack. The ledger is not a confession or a scoreboard. It is closer to a flight log — dry, specific, and useful precisely because it resists the temptation to moralize."],reflection:"Think of two separate setbacks from the past few months that felt unrelated at the time. Looking at them together now, is there a shared trigger or pattern you can name in one word?",exercise:"Write your first setback ledger entry for the most recent thing that went wrong: (1) what happened, (2) what triggered it, (3) one different action for next time, (4) one word naming the pattern. Keep this format for every setback this month.",quote:"A feeling fades in days. A pattern only shows up if you write it down."},{id:"ch-sustained-effort",type:"chapter",bookId:"book-resilience",partId:"part-foundations",order:6,title:"Sustained Effort",subtitle:"Building a resilience practice that lasts",tags:["consistency","practice","identity"],emotion:"resolved",difficulty:"advanced",estimatedReadingMinutes:10,body:["Everything in the previous five chapters — regulating the stress response, reframing setbacks, scheduling recovery, removing willpower from the loop, and logging failures — is individually simple and collectively fragile, because each one is easy to do for a week and easy to abandon in the second week when nothing dramatic seems to have changed yet.","This happens because resilience compounds on a timescale longer than motivation naturally lasts. The visible payoff — faster recovery from a bad day, fewer repeated mistakes, steadier output under pressure — typically shows up only after weeks of unglamorous repetition, well past the point where most attempts have already quietly stopped.","In practice, the people who sustain this longest are not the ones with the most discipline in the abstract. They are the ones who tied the practice to a fixed, small, non-negotiable cadence rather than to how motivated or improved they felt that day — a short daily check tied to an existing routine (after coffee, before sleep) rather than a longer practice done 'whenever there's time,' which reliably becomes never.","The evidence from behavior-change research is consistent on one point: consistency at low intensity outperforms intensity without consistency, almost every time, over any period longer than a month. Two minutes of the breathing practice done daily beats twenty minutes done once a week. This is counter to how the practice feels in the moment — the twenty-minute session feels more serious — but it is not what actually changes the underlying baseline.","The identity shift that makes this durable is subtle: stop asking 'did today go well' and start asking 'did I run the practice today,' regardless of outcome. A day can go badly and still be a successful day for the practice, because the practice was run. Divorcing the habit from the daily result is what allows it to survive the weeks — and there will be weeks — where the results aren't visible at all."],reflection:"Which of the five practices from this book (breathing, reframing, scheduled recovery, two-minute habits, the setback ledger) is most likely to survive a genuinely bad week for you, and which is most likely to get dropped first? Why?",exercise:"Choose the one practice you're most likely to keep. Attach it to an existing daily anchor (right after you do X, you do this) and commit to the two-minute minimum version only, for the next 14 days, regardless of how the days go.",quote:"Resilience isn't built in the dramatic weeks. It's built in the ones where nothing seems to be happening at all."}],worksheets:[{id:"ws-daily-check",title:"Daily Resilience Check",relatedChapterIds:["ch-stress-response","ch-discipline-systems"],description:"A two-minute end-of-day check-in. Fill it out once, right befo e last time a strong emotion made a decision for you. What would ninety seconds of not feeding it have changed?",exercise:"The next time you notice activation, start a ninety-second timer, exhale long, name the emotion out loud or in writing, and change position. Note what you did next.",quote:"You rarely need the wave to stop. You need ninety seconds where you don't add to it."},{id:"ch-field-script",order:2,title:"The Two-Sentence Script",subtitle:"Saying the hard thing without the heat",tags:["communication","conflict","boundaries"],emotion:"anxious",difficulty:"intermediate",estimatedReadingMinutes:7,body:["Hard conversations fail less often on the substance than on the delivery. Under pressure, people reach for either an accusation or a retreat, and both cost you the outcome you actually wanted.","A two-sentence script removes the improvisation. Sentence one names the specific, observable thing. Sentence two names the specific ask. No history, no character assessment, no 'you always'.","For example: 'The last two drafts came in after the deadline. I need them by Thursday at noon so I can review them before the client call.' That is the whole script. It is hard to argue with because it contains nothing to argue with — only a fact and a request.","The skill is holding the line at two sentences. Under pressure the urge is to add a third, a fourth, a justification — and each addition reopens the door to the fight you were trying to avoid."],reflection:"What is one conversation you have been avoiding? Write its two sentences — the observable fact, and the specific ask. Nothing else.",exercise:"Write the two-sentence script for a conversation you have been postponing, then have it within 48 hours, holding to exactly two sentences.",quote:"A fact and a request. Everything after that is usually the argument starting."},{id:"ch-field-review",order:3,title:"The Five-Minute Close",subtitle:"Ending the day so it doesn't follow you home",tags:["recovery","reflection","habit"],emotion:"tired",difficulty:"foundational",estimatedReadingMinutes:8,body:["The workday rarely ends at the end of the workday. It ends whenever the mind finally stops rehearsing the unfinished list — which, without a ritual, can be hours later or not at all.","A close ritual works because the mind holds open loops until they are written down somewhere it trusts. The list does not need to be finished; it needs to be captured, so the mind can stop holding it.","Five minutes, three moves: write the single most important thing for tomorrow, write one thing that went right today, and name one thing you are deliberately leaving until tomorrow. Then close the notebook.","The measure of the ritual is not productivity. It is whether the evening is actually yours — whether the day stops when you decide it does, rather than when the list finally goes quiet."],reflection:"What unfinished loop does your mind rehearse after hours? What would it take for it to trust that it is captured and can be released?",exercise:"For five consecutive evenings, run the close: tomorrow's one thing, one thing that went right, one thing deliberately left. Note whether the evening felt more yours.",quote:"The day ends when you decide it does — not when the list finally goes quiet."}].forEach(t=>{t.type="chapter",t.bookId=e,t.partId="part-field",n.chapters.push(t)}),a.length=0,n.chapters.slice().sort((e,t)=>e.order-t.order).forEach(e=>a.push(e))}();const tt="3.0";function nt(){try{if(re(),A(),function(){const e=document.getElementById("main");e.addEventListener("scroll",()=>{if("reader"!==E().view)return;const t=c.session.currentChapterId;if(!t)return;const n=e.scrollHeight-e.clientHeight,a=n>0?Math.min(100,Math.round(e.scrollTop/n*100)):100,i=document.getElementById("reader-progress-fill");i&&(i.style.width=a+"%");const s=c.progress[t];s&&"complete"!==s.status&&(s.percent=Math.max(s.percent||0,a)),c.session.scrollByChapter[t]=e.scrollTop},{passive:!0})}(),et(),c.settings.lock&&!window.__unlocked)
