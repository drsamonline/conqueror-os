<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Wall not found · Conqueror OS</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#12151c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2312151c'/%3E%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='%23f59e0b' stroke-width='2'/%3E%3Ctext x='16' y='23' font-size='17' font-weight='900' text-anchor='middle' fill='%23f59e0b' font-family='Arial,sans-serif'%3EC%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#12151c;--panel:#1a1f2a;--line:#2b3140;--amber:#f59e0b;--ink:#eef1f7;--steel:#9aa3b4;--mono:"SFMono-Regular",Menlo,Consolas,monospace;--disp:"Arial Black","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
display:grid;place-items:center;padding:32px;
background-image:linear-gradient(rgba(245,158,11,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(245,158,11,.035) 1px,transparent 1px);background-size:44px 44px}
.box{max-width:640px;width:100%;border:3px solid var(--line);background:var(--panel);padding:44px 38px}
.code{font-family:var(--disp);font-size:clamp(64px,16vw,132px);line-height:.9;color:var(--amber);letter-spacing:.02em}
h1{font-family:var(--disp);text-transform:uppercase;font-size:clamp(22px,4vw,34px);margin:16px 0 10px;letter-spacing:.02em}
p{color:var(--steel);margin:0 0 26px;font-size:16px}
a.btn{display:inline-block;font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:14px;
padding:14px 22px;background:var(--amber);color:#141414;border:3px solid var(--amber);text-decoration:none;margin-right:12px}
a.btn:hover{background:#fff;border-color:#fff}
a.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
a.ghost:hover{border-color:var(--amber);color:var(--amber);background:rgba(245,158,11,.06)}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
</style>
</head>
<body>
  <main class="box">
    <div class="tag">// Conqueror OS</div>
    <div class="code">404</div>
    <h1>This wall has no gate</h1>
    <p>The page you were looking for does not exist here. Discipline means going back to the start.</p>
    <a class="btn" href="/conqueror-os/">Return to base</a>
    <a class="btn ghost" href="/conqueror-os/play/">Open the app</a>
  </main>
</body>
</html>
